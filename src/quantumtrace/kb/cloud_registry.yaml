# KMS key specs whose meaning depends on the provider partition. Only specs whose algorithm AWS does not fix
# by name appear here. RSA_*, ECC_NIST_P*, EC_prime256v1 and the other spellings are aliases in
# kb/algorithms.yaml (M1, M1M4-20).
# Sources, fetched 2026-10-10:
#   https://docs.aws.amazon.com/kms/latest/developerguide/symm-asymm-choose-key-spec.html
#     "SYMMETRIC_DEFAULT represents AES-256-GCM ... with 256-bit keys." and "The only exception in China
#     Regions, where SYMMETRIC_DEFAULT represents a 128-bit symmetric key that uses SM4 encryption."
#   https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html
#     partitions: "aws - AWS Regions", "aws-cn - China Regions", "aws-us-gov - AWS GovCloud (US) Regions".
# The partition is the second field of the KeyArn (arn:<partition>:kms:<region>:<account>:key/<id>).
# A partition without a row is UNKNOWN: use `default` only for the partitions listed under `default_partitions`.
# mode is lowercase like the schema mode of kb/algorithms.yaml. mode is null for SM4 because the AWS page states no mode.
kms_key_specs:
  SYMMETRIC_DEFAULT:
    verified: true
    default_partitions: [aws, aws-us-gov]
    default:
      algorithm: AES
      key_size: 256
      mode: gcm
    partitions:
      aws-cn:
        algorithm: SM4
        key_size: 128
        mode: null
