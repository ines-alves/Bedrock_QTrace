# ELB security-policy table, hand-built from AWS primary documentation (M4, task 4.4).
# Sources, fetched 2026-10-10:
#   ALB: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
#   NLB: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/describe-ssl-policies.html
# Rows come from the "Protocols by policy" and "Ciphers by policy" tables. On every policy that both pages
# list, protocols and ciphers are identical. ELBSecurityPolicy-2015-05 exists on the NLB page only.
#
# Field meaning:
#   protocols     TLS versions the policy accepts (AWS "Protocols by policy").
#   cipher_suites suites the policy accepts, exactly as AWS publishes them (OpenSSL names for TLS 1.2,
#                 IANA names for TLS 1.3). Configured, not negotiated.
#   groups        Key-exchange groups AWS documents for the policy. Empty for every classical policy: AWS does
#                 not publish groups for them. Never fill this from memory. PQ policies list only the three
#                 hybrid groups AWS names in the policy considerations on both pages.
#   groups_verified true when groups come from the AWS pages (PQ rows), false when AWS publishes none.
#   groups_complete false everywhere: AWS says PQ policies also support classical groups, which it does not
#                 name, so the list never proves the absence of a group.
#   pq_hybrid     true when the policy name contains PQ.
#   verified      true when protocols and cipher_suites were read from the AWS tables above.
#
# `source` on a row is the key into meta.sources (alb, nlb, or alb+nlb when both pages list it).
# A policy name that is not in this table is UNKNOWN: the finding keeps the name and gets no suites.
meta:
  schema: 1
  fetched: '2026-10-10'
  sources:
    alb: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
