# QuantumTrace policy and sourced facts; do not treat legacy aliases as compliance.
- id: 3DES
  family: 3DES
  primitive_by_usage:
    default: block-cipher
  tier: MEDIUM
  threat: grover
  note: QuantumTrace policy; SAFE is scoped to quantum classification, not a security
    audit.
  sources:
  - &id001
    url: repo:docs/PLAN.md#7-domain-knowledge
    checked_on: '2026-10-10'
    note: Repository quantum-risk policy; tiers and legacy flags are policy, not a
      certification.
  classically_broken: true
  replacement:
    default: &id002
      algorithm_id: AES
      key_size: 256
      mode: gcm
      standard: NIST SP 800-38D
  aliases:
  - TDEA
  - DESede
  - DES3
  - TripleDES
  - 3des-cbc
- id: AES
  family: AES
  primitive_by_usage:
    default: block-cipher
  threat: grover
  note: 'Policy: tier follows the observed key size (256-bit SAFE; 128-bit, 192-bit
    or unobserved size MEDIUM); nominal key bits do not assert a NIST quantum category.'
  sources:
  - *id001
  - &id010
    url: https://csrc.nist.gov/projects/computer-security-objects-register/algorithm-registration
    checked_on: '2026-10-10'
    note: Verified algorithm OIDs only; security levels are not inferred from OIDs.
  key_sizes:
  - 128
  - 192
  - 256
  tier_by_key_size:
    '128': MEDIUM
    '192': MEDIUM
    '256': SAFE
    unknown: MEDIUM
  modes: &id003
  - ecb
  - cbc
  - ctr
  - cfb
  - ofb
  - gcm
  - ccm
  - other
  primitive_by_mode:
    gcm: ae
    ccm: ae
  patterns:
  - ^aes(?P<size>128|192|256)?(?P<mode>gcm|cbc|ctr|ecb|ccm|cfb|ofb|siv)?$
  - ^aes(?P<mode>gcm|cbc|ctr|ecb|ccm|cfb|ofb)(?P<size>128|192|256)$
  replacement:
    default: *id002
  warnings:
  - ecb_mode
  aliases:
  - AES/ECB/PKCS5Padding
  - AES/GCM/NoPadding
  oids:
    AES-128-GCM: 2.16.840.1.101.3.4.1.6
    AES-256-GCM: 2.16.840.1.101.3.4.1.46
