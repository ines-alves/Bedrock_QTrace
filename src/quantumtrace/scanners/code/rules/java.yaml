# Java rules for the code scanner. Field reference: the module docstring of engine.py.
#
# raw_name is the string as it appears in the code (M1M3-03): the algorithm or transformation
# literal, never rewritten. A mode is set only from an explicit transformation string. A bare "AES"
# or a call that names a provider leaves mode None (M1M3-06). Nothing here assigns a tier.
#
# Constant arguments: a factory called with a file-scope String constant (MessageDigest.getInstance(ALGO))
# has a *_REF rule. It emits only when the constant resolves to a string (values_must_match), so a
# parameter or an imported name emits nothing. The raw name is the resolved value, at confidence 1.0
# and resolved_from_line set.
#
# Scope today: the starter-kit scenarios and their SAFE decoys, plus KeyAgreement, KEM, EC curves,
# DH and DSA sizes and ML-KEM/ML-DSA names (task 6, Java slice). Names checked against the Java SE 24
# standard algorithm names page, 2026-10-10. # verify
# Not covered: KeyFactory (key loading), SecretKeySpec with a constant algorithm, provider-specific
# names, bare Cipher/Signature wrapped in helper methods.

# ---- hashes, MAC, KDF ---------------------------------------------------------------------------

- id: JAVA_MESSAGE_DIGEST
  language: java
  pattern: '\bMessageDigest\.getInstance\(\s*"(?P<algo>[^"]+)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: hash
  library: java.security

- id: JAVA_MAC
  language: java
  pattern: '\bMac\.getInstance\(\s*"(?P<algo>[^"]+)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: mac
  library: javax.crypto

- id: JAVA_PBKDF2
  language: java
  pattern: '\bSecretKeyFactory\.getInstance\(\s*"(?P<algo>PBKDF2[^"]*)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: kdf
  library: javax.crypto
  iterations: {callee: 'new\s+PBEKeySpec', arg: 2}

- id: JAVA_MESSAGE_DIGEST_REF
  language: java
  pattern: '\bMessageDigest\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: hash
  library: java.security
  values_must_match:
    algo: '.+'

- id: JAVA_MAC_REF
  language: java
  pattern: '\bMac\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: mac
  library: javax.crypto
  values_must_match:
    algo: '.+'

- id: JAVA_PBKDF2_REF
  language: java
  pattern: '\bSecretKeyFactory\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: kdf
  library: javax.crypto
  iterations: {callee: 'new\s+PBEKeySpec', arg: 2}
  values_must_match:
    algo: 'PBKDF2.*'

# ---- asymmetric keys and signatures -------------------------------------------------------------

# RSA generation carries the size, usually on the following initialize(N) call. The usage is not
# known from a generation call.
- id: JAVA_KEYPAIR_RSA
  language: java
  pattern: '\bKeyPairGenerator\.getInstance\(\s*"(?P<algo>RSA)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: unknown
  library: java.security
  lookahead_pattern: '\.initialize\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]'
  lookahead_lines: 5
  provides_key_size: RSA

- id: JAVA_KEYPAIR_RSA_REF
  language: java
  pattern: '\bKeyPairGenerator\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: unknown
  library: java.security
  lookahead_pattern: '\.initialize\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]'
  lookahead_lines: 5
  provides_key_size: RSA
  values_must_match:
    algo: 'RSA'

# Finite-field DH and DSA take their size from initialize(N). The usage of a generation is unknown.
- id: JAVA_KEYPAIR_FFC
  language: java
  pattern: '\bKeyPairGenerator\.getInstance\(\s*"(?P<algo>DH|DiffieHellman|DSA)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: unknown
  library: java.security
  lookahead_pattern: '\.initialize\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]'
  lookahead_lines: 5

# EC: the curve comes from an ECGenParameterSpec literal handed to initialize in one of the next three
# statements of the same generator. A heuristic (the variable is not checked), so confidence 0.8.
# A key without a spec stays EC with no curve (JAVA_KEYPAIR_OTHER). The curve is as seen (secp256r1).
- id: JAVA_KEYPAIR_EC_CURVE
  language: java
  pattern: >-
    \bKeyPairGenerator\.getInstance\(\s*"(?P<algo>EC)"\s*(?:,[^()]*)?\)\s*;(?:[^;{}]*;){0,3}?\s*[A-Za-z_]\w*\.initialize\(\s*new\s+ECGenParameterSpec\(\s*"(?P<curve>[^"]+)"
  raw_name: EC
  kind_hint: algorithm
  usage: unknown
  curve: '{curve}'
  confidence: 0.8
  library: java.security

# A curve spec is evidence of an EC key wherever it appears. Absorbed when JAVA_KEYPAIR_EC_CURVE already
# reports it.
- id: JAVA_EC_GEN_PARAM_SPEC
  language: java
  pattern: '\bnew\s+ECGenParameterSpec\(\s*"(?P<curve>[^"]+)"'
  absorbed_by: [JAVA_KEYPAIR_EC_CURVE]
  raw_name: EC
  kind_hint: algorithm
  usage: unknown
  curve: '{curve}'
  library: java.security

# EdDSA keys exist only to sign (M1M3 session 26 reply): generation is usage signature. The raw name is
# as seen (Ed25519, Ed448 or the generic EdDSA). Every other generator keeps usage unknown.
- id: JAVA_KEYPAIR_EDDSA
  language: java
  pattern: '\bKeyPairGenerator\.getInstance\(\s*"(?P<algo>Ed25519|Ed448|EdDSA)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: signature
  library: java.security

- id: JAVA_KEYPAIR_EDDSA_REF
  language: java
  pattern: '\bKeyPairGenerator\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: signature
  library: java.security
  values_must_match:
    algo: 'Ed25519|Ed448|EdDSA'

- id: JAVA_KEYPAIR_OTHER
  language: java
  absorbed_by: [JAVA_KEYPAIR_EC_CURVE]
  pattern: '\bKeyPairGenerator\.getInstance\(\s*"(?P<algo>(?!RSA"|DH"|DiffieHellman"|DSA"|Ed25519"|Ed448"|EdDSA")[^"]+)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: unknown
  library: java.security

# Constant argument of any other algorithm: reported as seen.
- id: JAVA_KEYPAIR_OTHER_REF
  language: java
  pattern: '\bKeyPairGenerator\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: unknown
  library: java.security
  values_must_match:
    algo: '(?!RSA$|Ed25519$|Ed448$|EdDSA$).+'

# Key agreement and KEM. The usage is the primitive's own.
- id: JAVA_KEY_AGREEMENT
  language: java
  pattern: '\bKeyAgreement\.getInstance\(\s*"(?P<algo>[^"]+)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: key_exchange
  library: javax.crypto

- id: JAVA_KEY_AGREEMENT_REF
  language: java
  pattern: '\bKeyAgreement\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: key_exchange
  library: javax.crypto
  values_must_match:
    algo: '.+'

- id: JAVA_KEM
  language: java
  pattern: '\bKEM\.getInstance\(\s*"(?P<algo>[^"]+)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: key_exchange
  library: javax.crypto

- id: JAVA_KEM_REF
  language: java
  pattern: '\bKEM\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: key_exchange
  library: javax.crypto
  values_must_match:
    algo: '.+'

# RSA signature sites carry no size of their own. The size comes only through a demonstrated flow
# link from the key passed to initSign or initVerify.
- id: JAVA_SIGNATURE_RSA
  language: java
  pattern: '\bSignature\.getInstance\(\s*"(?P<algo>[^"]*RSA[^"]*)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: signature
  library: java.security
  key_arg_pattern: '\.init(?:Sign|Verify)\(\s*(?P<key_arg>[A-Za-z_]\w*)\s*\)'
  key_arg_lines: 5
  inherit_key_size: RSA

- id: JAVA_SIGNATURE_OTHER
  language: java
  pattern: '\bSignature\.getInstance\(\s*"(?P<algo>(?![^"]*RSA)[^"]+)"'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: signature
  library: java.security

- id: JAVA_SIGNATURE_RSA_REF
  language: java
  pattern: '\bSignature\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: signature
  library: java.security
  key_arg_pattern: '\.init(?:Sign|Verify)\(\s*(?P<key_arg>[A-Za-z_]\w*)\s*\)'
  key_arg_lines: 5
  inherit_key_size: RSA
  values_must_match:
    algo: '.*RSA.*'

- id: JAVA_SIGNATURE_OTHER_REF
  language: java
  pattern: '\bSignature\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{algo}'
  kind_hint: algorithm
  usage: signature
  library: java.security
  values_must_match:
    algo: '(?!.*RSA).+'

# ---- symmetric ciphers --------------------------------------------------------------------------

# Key sources for AES: KeyGenerator.init(N) and SecretKeySpec over a constant of known length.
# Never reported on their own.
- id: JAVA_KEYGEN_AES
  language: java
  pattern: '\bKeyGenerator\.getInstance\(\s*"AES"'
  kind_hint: key
  usage: encryption
  lookahead_pattern: '\.init\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]'
  lookahead_lines: 5
  provides_key_size: AES
  emit: false

- id: JAVA_KEYGEN_AES_REF
  language: java
  pattern: '\bKeyGenerator\.getInstance\(\s*(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]'
  kind_hint: key
  usage: encryption
  lookahead_pattern: '\.init\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]'
  lookahead_lines: 5
  provides_key_size: AES
  emit: false
  values_must_match:
    algo: 'AES'

- id: JAVA_SECRET_KEY_SPEC_AES
  language: java
  pattern: '\bnew\s+SecretKeySpec\(\s*(?P<key_size_ref>[A-Za-z_]\w*)\s*,\s*"AES"'
  kind_hint: key
  usage: encryption
  key_size_from_length: true
  provides_key_size: AES
  emit: false

# Cipher.getInstance with an AES literal. The transformation states mode and padding. A bare "AES"
# states neither, so mode stays None. A second argument (a provider) does not change that.
- id: JAVA_CIPHER_AES
  language: java
  pattern: '\bCipher\.getInstance\(\s*"(?P<transform>AES[^"]*)"'
  raw_name: '{transform}'
  kind_hint: algorithm
  usage: encryption
  mode: '{mode}'
  padding: '{padding}'
  library: javax.crypto
  refine:
    from: transform
    pattern: '^(?P<algo>[^/]+)(?:/(?P<mode>[^/]+))?(?:/(?P<padding>[^/]+))?$'
  key_arg_pattern: '\.init\(\s*[^,()]+,\s*(?P<key_arg>[A-Za-z_]\w*)'
  key_arg_lines: 5
  inherit_key_size: AES

# Cipher.getInstance(CONSTANT). The constant is resolved at file scope. Limitation: a constant that
# resolves to a non-AES transformation still looks for an AES key flow and ends unresolved.
- id: JAVA_CIPHER_REF
  language: java
  pattern: '\bCipher\.getInstance\(\s*(?P<transform_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: '{transform}'
  kind_hint: algorithm
  usage: encryption
  mode: '{mode}'
  padding: '{padding}'
  library: javax.crypto
  refine:
    from: transform
    pattern: '^(?P<algo>(?!RSA)[^/]+)(?:/(?P<mode>[^/]+))?(?:/(?P<padding>[^/]+))?$'
  key_arg_pattern: '\.init\(\s*[^,()]+,\s*(?P<key_arg>[A-Za-z_]\w*)'
  key_arg_lines: 5
  inherit_key_size: AES

# RSA ciphers are encryption sinks for the RSA key flow, so a generated key used for encryption is
# never reported as a signing key. The transform is the raw name and mode and padding stay None.
- id: JAVA_CIPHER_RSA
  language: java
  pattern: '\bCipher\.getInstance\(\s*"(?P<transform>RSA(?:/[^"]*)?)"'
  raw_name: '{transform}'
  kind_hint: algorithm
  usage: encryption
  library: javax.crypto
  key_arg_pattern: '\.init\(\s*[^,()]+,\s*(?P<key_arg>[A-Za-z_]\w*)'
  key_arg_lines: 5
  inherit_key_size: RSA

- id: JAVA_CIPHER_OTHER
  language: java
  pattern: '\bCipher\.getInstance\(\s*"(?P<transform>(?!AES|RSA(?:/|"))[^"]+)"'
  raw_name: '{transform}'
  kind_hint: algorithm
  usage: encryption
  mode: '{mode}'
  padding: '{padding}'
  library: javax.crypto
  refine:
    from: transform
    pattern: '^(?P<algo>(?!RSA)[^/]+)(?:/(?P<mode>[^/]+))?(?:/(?P<padding>[^/]+))?$'

# Hard-coded key (M1M3-02, M1M3-04): fires only when a literal reaches SecretKeySpec(..., "AES"), inline or
# through a file-scope constant. The finding is at the literal's line. A key spec for another algorithm
# (HmacSHA256) is outside the rule.
- id: JAVA_HARDCODED_AES_KEY
  language: java
  pattern: >-
    \bnew\s+SecretKeySpec\(\s*(?:(?P<literal>"(?:[^"\\]|\\.)*"\s*\.getBytes\([^)]*\))|(?P<key_arg>[A-Za-z_]\w*))\s*,\s*"AES"\s*\)
  raw_name: hard-coded symmetric key
  kind_hint: key
  usage: encryption
  library: javax.crypto
  literal_key: AES
  redact: true
  extra:
    hygiene_only: true
    hygiene_flags: [hardcoded_key]

# ---- insecure RNG -------------------------------------------------------------------------------

# Hygiene warning, not a primitive (M1M3-04). SecureRandom is a decoy and has no rule.
- id: JAVA_INSECURE_RNG
  language: java
  pattern: '\bnew\s+(?:java\.util\.)?Random\s*\('
  raw_name: java.util.Random
  kind_hint: algorithm
  usage: rng
  library: java.util
  extra:
    hygiene_only: true
    hygiene_flags: [insecure_rng]

# ---- configured obsolete TLS and SSL versions (M3M4-09, M1M3-16) --------------------------------

# SSLContext.getInstance("TLSv1"), "TLSv1.1" and "SSLv3", literal or a file-scope String constant. One
# raw_name spelling per version ("TLS 1.0", "TLS 1.1", "SSLv3"); the protocol string as written goes
# in extra["source_constant"]. "TLS", "TLSv1.2", "TLSv1.3" and "SSL" (which spans several versions) emit
# nothing. Not covered: setEnabledProtocols, jdk.tls.disabledAlgorithms and java.security files.
# Names checked on the Java SE standard algorithm names page (SSLContext), 2026-10-10. # verify
- id: JAVA_TLS_10
  language: java
  pattern: '\bSSLContext\.getInstance\(\s*"(?P<proto>TLSv1)"'
  raw_name: TLS 1.0
  kind_hint: protocol_version
  usage: unknown
  library: javax.net.ssl
  extra:
    source_constant: '{proto}'

- id: JAVA_TLS_10_REF
  language: java
  pattern: '\bSSLContext\.getInstance\(\s*(?P<proto_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: TLS 1.0
  kind_hint: protocol_version
  usage: unknown
  library: javax.net.ssl
  values_must_match:
    proto: 'TLSv1'
  extra:
    source_constant: '{proto}'

- id: JAVA_TLS_11
  language: java
  pattern: '\bSSLContext\.getInstance\(\s*"(?P<proto>TLSv1\.1)"'
  raw_name: TLS 1.1
  kind_hint: protocol_version
  usage: unknown
  library: javax.net.ssl
  extra:
    source_constant: '{proto}'

- id: JAVA_TLS_11_REF
  language: java
  pattern: '\bSSLContext\.getInstance\(\s*(?P<proto_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: TLS 1.1
  kind_hint: protocol_version
  usage: unknown
  library: javax.net.ssl
  values_must_match:
    proto: 'TLSv1\.1'
  extra:
    source_constant: '{proto}'

- id: JAVA_SSL_30
  language: java
  pattern: '\bSSLContext\.getInstance\(\s*"(?P<proto>SSLv3)"'
  raw_name: SSLv3
  kind_hint: protocol_version
  usage: unknown
  library: javax.net.ssl
  extra:
    source_constant: '{proto}'

- id: JAVA_SSL_30_REF
  language: java
  pattern: '\bSSLContext\.getInstance\(\s*(?P<proto_ref>[A-Za-z_]\w*)\s*[,)]'
  raw_name: SSLv3
  kind_hint: protocol_version
  usage: unknown
  library: javax.net.ssl
  values_must_match:
    proto: 'SSLv3'
  extra:
    source_constant: '{proto}'

# ---- unresolved algorithm names (outside validation F1) --------------------------------------------
# A factory whose algorithm is a parameter, a field or an expression is still a cryptographic call.
# One finding per call, raw name "unresolved" (never the identifier), confidence 0.5, the argument in
# extra.unresolved_argument. It fires only when the *_REF rules of the same call could not resolve
# the name, and it is absorbed by the one *_REF rule (Cipher) that already emits unresolved calls.

- id: JAVA_MESSAGE_DIGEST_UNRESOLVED
  language: java
  pattern: '\bMessageDigest\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: hash
  library: java.security
  only_unresolved: true
  absorbed_by: [JAVA_MESSAGE_DIGEST_REF]

- id: JAVA_MAC_UNRESOLVED
  language: java
  pattern: '\bMac\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: mac
  library: javax.crypto
  only_unresolved: true
  absorbed_by: [JAVA_MAC_REF]

- id: JAVA_SIGNATURE_UNRESOLVED
  language: java
  pattern: '\bSignature\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: signature
  library: java.security
  only_unresolved: true
  absorbed_by: [JAVA_SIGNATURE_RSA_REF, JAVA_SIGNATURE_OTHER_REF]

- id: JAVA_CIPHER_UNRESOLVED
  language: java
  pattern: '\bCipher\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: encryption
  library: javax.crypto
  only_unresolved: true
  absorbed_by: [JAVA_CIPHER_REF]

- id: JAVA_KEYPAIR_UNRESOLVED
  language: java
  pattern: '\bKeyPairGenerator\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: unknown
  library: java.security
  only_unresolved: true
  absorbed_by: [JAVA_KEYPAIR_RSA_REF, JAVA_KEYPAIR_EDDSA_REF, JAVA_KEYPAIR_OTHER_REF]

- id: JAVA_KEY_AGREEMENT_UNRESOLVED
  language: java
  pattern: '\bKeyAgreement\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: key_exchange
  library: javax.crypto
  only_unresolved: true
  absorbed_by: [JAVA_KEY_AGREEMENT_REF]

- id: JAVA_KEYGEN_UNRESOLVED
  language: java
  pattern: '\bKeyGenerator\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: unknown
  library: javax.crypto
  only_unresolved: true
  absorbed_by: [JAVA_KEYGEN_AES_REF]

- id: JAVA_SECRET_KEY_FACTORY_UNRESOLVED
  language: java
  pattern: '\bSecretKeyFactory\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: unknown
  library: javax.crypto
  only_unresolved: true
  absorbed_by: [JAVA_PBKDF2_REF]

- id: JAVA_KEM_UNRESOLVED
  language: java
  pattern: '\bKEM\.getInstance\(\s*(?:(?P<algo_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![\"\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])'
  raw_name: unresolved
  kind_hint: algorithm
  usage: key_exchange
  library: javax.crypto
  only_unresolved: true
  absorbed_by: [JAVA_KEM_REF]

# ---- references: names used, not called (outside validation F2, F5) ------------------------------
# A standard JCA name held in a constant, an enum or a table (commons-codec MessageDigestAlgorithms,
# HmacAlgorithms, jjwt SignatureAlgorithm, spring PasswordEncoderFactories). reference: true caps
# confidence at 0.6 and drops the hit when a call of the same file reports the same name, so a literal
# inside getInstance("...") or a constant passed to one stays a single call finding. Names from the Java
# SE standard algorithm names (MessageDigest, Mac, Signature sections). # verify
- id: JAVA_JCA_DIGEST_NAME
  language: java
  pattern: '"(?P<name>MD2|MD5|SHA-1|SHA-224|SHA-256|SHA-384|SHA-512|SHA-512/224|SHA-512/256|SHA3-224|SHA3-256|SHA3-384|SHA3-512)"'
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: java.security
  reference: true

- id: JAVA_JCA_HMAC_NAME
  language: java
  pattern: '"(?P<name>Hmac(?:MD5|SHA1|SHA224|SHA256|SHA384|SHA512|SHA512/224|SHA512/256|SHA3-224|SHA3-256|SHA3-384|SHA3-512))"'
  raw_name: '{name}'
  kind_hint: algorithm
  usage: mac
  library: javax.crypto
  reference: true

- id: JAVA_JCA_SIGNATURE_NAME
  language: java
  pattern: '"(?P<name>(?:MD2|MD5|SHA1|SHA224|SHA256|SHA384|SHA512|SHA3-224|SHA3-256|SHA3-384|SHA3-512)with(?:RSA|ECDSA|DSA|RSA/PSS|RSAandMGF1)|RSASSA-PSS|Ed25519|Ed448|EdDSA)"'
  raw_name: '{name}'
