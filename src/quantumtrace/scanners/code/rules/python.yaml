# Python rules for the code scanner. Field reference: the module docstring of engine.py.
#
# raw_name is the algorithm token as it appears in the code (M1M3-03). Where the call carries no
# single token (module or class based APIs, composites) the scanner joins the observed tokens with
# "-" and the engine normalizer maps the result. Nothing here assigns a tier.
#
# Scope today: the starter-kit scenarios and their SAFE decoys. Wider library coverage comes later.

# ---- hashes -------------------------------------------------------------------------------------

- id: PY_HASHLIB
  language: python
  pattern: '\bhashlib\.(?P<name>md5|sha1|sha224|sha256|sha384|sha512)\('
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: hashlib

# hashlib.new(name): the name is a literal or a file-scope constant or parameter default. An algorithm
# outside the list emits nothing (values_must_match); an unresolved identifier or expression is
# reported by PY_HASHLIB_NEW_UNRESOLVED.
- id: PY_HASHLIB_NEW
  language: python
  pattern: >-
    \bhashlib\.new\(\s*(?:[bB]?["'](?P<name>(?i:md5|sha1|sha224|sha256|sha384|sha512))["']|(?P<name_ref>[A-Za-z_]\w*))\s*[,)]
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: hashlib
  values_must_match:
    name: '(?i)md5|sha1|sha224|sha256|sha384|sha512'

# hashlib.pbkdf2_hmac(hash_name, password, salt, iterations, dklen=None): the hash is the first
# argument, positional or hash_name=. Same value rules as hashlib.new (literal, constant or default,
# six names; an unresolved hash is PY_HASHLIB_PBKDF2_HMAC_UNRESOLVED). The raw name is the composite as
# seen. # verify
- id: PY_HASHLIB_PBKDF2_HMAC
  language: python
  pattern: >-
    \bhashlib\.pbkdf2_hmac\((?P<call>)\s*(?:hash_name\s*=\s*)?(?:[bB]?["'](?P<name>(?i:md5|sha1|sha224|sha256|sha384|sha512))["']|(?P<name_ref>[A-Za-z_]\w*))\s*[,)]
  raw_name: 'PBKDF2-HMAC-{name}'
  kind_hint: algorithm
  usage: kdf
  library: hashlib
  iterations: {arg: 3, keyword: iterations}
  values_must_match:
    name: '(?i)md5|sha1|sha224|sha256|sha384|sha512'

# hashlib.scrypt(password, *, salt, n, r, p, maxmem=0, dklen=64): reported as the KDF alone (M1 session 26:
# raw name "scrypt", usage kdf, no n, r or p and no underlying hash). # verify
- id: PY_HASHLIB_SCRYPT
  language: python
  pattern: '\bhashlib\.scrypt\('
  raw_name: scrypt
  kind_hint: algorithm
  usage: kdf
  library: hashlib

# A hash class inside a PBKDF2HMAC(...) call is part of that composite and is not reported twice
# (absorbed_by: the match of PY_PBKDF2 runs from PBKDF2HMAC( to the hash). The same class handed to
# HKDF, OAEP or any other call is reported.
- id: PY_CRYPTOGRAPHY_HASH
  language: python
  pattern: '\bhashes\.(?P<name>MD5|SHA1|SHA224|SHA256|SHA384|SHA512)\(\)'
  absorbed_by: [PY_PBKDF2]
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: cryptography

# ---- MAC and KDF --------------------------------------------------------------------------------

- id: PY_HMAC
  language: python
  pattern: >-
    \bhmac\.new\((?:\s*(?:[^,()]|\([^()]*\))+,){1,2}\s*(?:digestmod\s*=\s*)?hashlib\.(?P<name>md5|sha1|sha224|sha256|sha384|sha512)\b
  raw_name: 'HMAC-{name}'
  kind_hint: algorithm
  usage: mac
  library: hmac

# digestmod given as a string: hmac.new(k, m, "sha1") or hmac.new(k, m, digestmod="sha1"). A digest
# named through a variable bound to hashlib.sha1 is not followed (known gap).
- id: PY_HMAC_STRING
  language: python
  pattern: >-
    \bhmac\.new\((?:(?:\s*(?:[^,()]|\([^()]*\))+,){2}|(?:\s*(?:[^,()]|\([^()]*\))+,){1,2}\s*digestmod\s*=)\s*(?P<q>["'])(?P<name>(?i:md5|sha1|sha224|sha256|sha384|sha512))(?P=q)
  raw_name: 'HMAC-{name}'
  kind_hint: algorithm
  usage: mac
  library: hmac

# String constants used as digestmod retain the observed digest, like literal strings.
- id: PY_HMAC_STRING_REF
  language: python
  pattern: >-
    \bhmac\.new\((?:(?:\s*(?:[^,()]|\([^()]*\))+,){2}|(?:\s*(?:[^,()]|\([^()]*\))+,){1,2}\s*digestmod\s*=)\s*(?P<name_ref>[A-Za-z_]\w*)\s*[,)]
  raw_name: 'HMAC-{name}'
  kind_hint: algorithm
  usage: mac
  library: hmac
  values_must_match:
    name: '(?i:md5|sha1|sha224|sha256|sha384|sha512)'

# ---- unresolved digests (outside validation F3) -------------------------------------------------
# The call is the evidence even when the hash is a parameter or an expression (django
# utils/crypto.py pbkdf2_hmac(digest().name, ...)). hashlib.new reports "unresolved"; pbkdf2_hmac
# reports PBKDF2 with the iteration count when resolvable; hmac.new with a non-literal digest
# reports HMAC. Confidence 0.5 and the argument in extra.unresolved_argument. They fire only when the
# name did not resolve, so a constant still gives the named rule above.
- id: PY_HASHLIB_NEW_UNRESOLVED
  language: python
  pattern: >-
    \bhashlib\.new\(\s*(?:name\s*=\s*)?(?:(?P<name_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![bB]?[\"'\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])
  raw_name: unresolved
  kind_hint: algorithm
  usage: hash
  library: hashlib
  only_unresolved: true

- id: PY_HASHLIB_PBKDF2_HMAC_UNRESOLVED
  language: python
  pattern: >-
    \bhashlib\.pbkdf2_hmac\((?P<call>)\s*(?:hash_name\s*=\s*)?(?:(?P<name_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>(?![bB]?[\"'\s])[A-Za-z_][\w.]*(?:\([^()]*\))?(?:\.\w+(?:\([^()]*\))?)*)\s*[,)])
  raw_name: PBKDF2
  kind_hint: algorithm
  usage: kdf
  library: hashlib
  iterations: {arg: 3, keyword: iterations}
  only_unresolved: true

- id: PY_HMAC_UNRESOLVED
  language: python
  pattern: >-
    \bhmac\.new\((?:(?:\s*(?:[^,()]|\([^()]*\))+,){2}|(?:\s*(?:[^,()]|\([^()]*\))+,){1,2}\s*digestmod\s*=)\s*(?!hashlib\.|[bB]?["'])(?:(?P<name_ref>[A-Za-z_]\w*)\s*[,)]|(?P<argument>[A-Za-z_][\w.]*(?:\([^()]*\))?)\s*[,)])
  raw_name: HMAC
  kind_hint: algorithm
  usage: mac
  library: hmac
  only_unresolved: true

# A positional first argument (PBKDF2HMAC(hashes.SHA1(), ...)) is given the algorithm= keyword in the
# masked text by python_ast.py before this rule runs.
- id: PY_PBKDF2
  language: python
  pattern: >-
    \bPBKDF2HMAC\((?P<call>)(?:[^()]|\([^()]*\))*?\balgorithm\s*=\s*hashes\.(?P<name>[A-Za-z0-9_]+)\(\)
  raw_name: 'PBKDF2-HMAC-{name}'
  kind_hint: algorithm
  usage: kdf
  library: cryptography
  iterations: {arg: 2, keyword: iterations}

# ---- RSA ----------------------------------------------------------------------------------------

# Key generation carries the size. The usage is not known from a generation call.
- id: PY_RSA_GENERATE
  language: python
  pattern: >-
    \brsa\.generate_private_key\((?:[^()]|\([^()]*\))*?\bkey_size\s*=\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))
  raw_name: RSA
  kind_hint: algorithm
  usage: unknown
  library: cryptography
  provides_key_size: RSA

- id: PY_RSA_GENERATE_POSITIONAL
  language: python
  pattern: '\brsa\.generate_private_key\(\s*\d+\s*,\s*(?P<key_size>\d+)'
  raw_name: RSA
  kind_hint: algorithm
  usage: unknown
  library: cryptography
  provides_key_size: RSA

# Sign and verify sites carry no size of their own. The padding argument separates RSA from ECDSA and
# Ed25519, which have the same method names. The size comes only through a demonstrated flow link.
- id: PY_RSA_SIGN_VERIFY
  language: python
  pattern: >-
    (?P<key_arg>[A-Za-z_]\w*)\s*\.\s*(?:sign|verify)\((?:[^()]|\([^()]*\))*?\bpadding\.(?P<pad>PKCS1v15|PSS)\(
  raw_name: RSA
  kind_hint: algorithm
  usage: signature
  padding: '{pad}'
  library: cryptography
  inherit_key_size: RSA

# RSA encryption sinks exist so that a generated key used for encryption is never reported as a signing
# key. The padding argument (OAEP or PKCS1v15) separates RSA from other key types with an encrypt method.
# The receiver may be a name or name.public_key().
- id: PY_RSA_ENCRYPT_DECRYPT
  language: python
  pattern: >-
    (?P<key_arg>[A-Za-z_]\w*)(?:\s*\.\s*public_key\(\s*\))?\s*\.\s*(?:encrypt|decrypt)\((?:[^()]|\([^()]*\))*?\bpadding\.(?P<pad>OAEP|PKCS1v15)\(
  raw_name: RSA
  kind_hint: algorithm
  usage: encryption
  padding: '{pad}'
  library: cryptography
  inherit_key_size: RSA

# ---- Ed25519 ------------------------------------------------------------------------------------

- id: PY_ED25519_GENERATE
  language: python
  pattern: '\b(?:ed25519\.)?Ed25519PrivateKey\.generate\(\)'
  raw_name: Ed25519
  kind_hint: algorithm
  usage: signature
  library: cryptography

# ---- X25519, X448, ECDH -------------------------------------------------------------------------

# Key agreement only. Generating or loading a private key, or loading a peer public key, is evidence.
# X25519PrivateKey and friends are written bare (python_ast.BARE_MEMBERS), the module prefix is optional.
- id: PY_X25519
  language: python
  pattern: >-
    \b(?:x25519\.)?(?:X25519PrivateKey\.(?:generate|from_private_bytes)|X25519PublicKey\.from_public_bytes)\(
  raw_name: X25519
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

- id: PY_X448
  language: python
  pattern: >-
    \b(?:x448\.)?(?:X448PrivateKey\.(?:generate|from_private_bytes)|X448PublicKey\.from_public_bytes)\(
  raw_name: X448
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

# private_key.exchange(ec.ECDH(), peer_public_key). The curve comes from the key, not from this call, so
# none is reported here (the EC key rules carry it).
- id: PY_ECDH
  language: python
  pattern: '\bec\.ECDH\(\)'
  raw_name: ECDH
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

# ---- EC keys and ECDSA --------------------------------------------------------------------------

# A named curve class is the evidence of an EC key (generate_private_key, derive_private_key,
# from_encoded_point, public numbers all take one), so the curve class is matched instead of each
# consumer. The usage is not known from the curve: raw_name EC, usage unknown. The curve classes are
# the cryptography.hazmat.primitives.asymmetric.ec names (SECP, SECT, Brainpool families). # verify
- id: PY_EC_CURVE
  language: python
  pattern: '\bec\.(?P<curve>SECP(?:192R1|224R1|256K1|256R1|384R1|521R1)|SECT(?:163K1|163R2|233[KR]1|283[KR]1|409[KR]1|571[KR]1)|BrainpoolP(?:256|384|512)R1)\b'
  raw_name: EC
  kind_hint: algorithm
  usage: unknown
  curve: '{curve}'
  library: cryptography

# ec.ECDSA(hash) is the signature algorithm argument of sign and verify. The curve belongs to the key.
- id: PY_ECDSA
  language: python
  pattern: '\bec\.ECDSA\('
  raw_name: ECDSA
  kind_hint: algorithm
  usage: signature
  library: cryptography

# ---- DH and DSA ---------------------------------------------------------------------------------

# Finite-field Diffie-Hellman only agrees keys and DSA only signs, so the usage is the algorithm's own.
# The size comes from the key_size argument: a literal, or a file-scope constant.
- id: PY_DH_GENERATE
  language: python
  pattern: >-
    \bdh\.generate_parameters\((?:[^()]|\([^()]*\))*?\bkey_size\s*=\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))
  raw_name: DH
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

# dh.generate_parameters(generator, key_size): the size is the second positional argument.
- id: PY_DH_GENERATE_POSITIONAL
  language: python
  pattern: >-
    \bdh\.generate_parameters\(\s*[^,()=]+,\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]
  raw_name: DH
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

- id: PY_DSA_GENERATE
  language: python
  pattern: >-
    \bdsa\.generate_(?:private_key|parameters)\((?:[^()]|\([^()]*\))*?\bkey_size\s*=\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))
  raw_name: DSA
  kind_hint: algorithm
  usage: signature
  library: cryptography

# dsa.generate_private_key(key_size) takes the size as its first positional argument.
- id: PY_DSA_GENERATE_POSITIONAL
  language: python
  pattern: >-
    \bdsa\.generate_(?:private_key|parameters)\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]
  raw_name: DSA
  kind_hint: algorithm
  usage: signature
  library: cryptography

# ---- AES ----------------------------------------------------------------------------------------

# Key source: os.urandom of a named or literal length. Never reported on its own.
- id: PY_URANDOM_KEY
  language: python
  pattern: '\bos\.urandom\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*\)'
  raw_name: AES-KEY
  kind_hint: key
  usage: encryption
  key_size_unit: bytes
  provides_key_size: AES
  emit: false

# Cipher(algorithms.AES(key), modes.X(...)), algorithm and mode positional or keyword, key positional
# or key=. The mode is stated by the call. The key size comes from an inline literal (group
# key_literal, its length), a parameter default or constant directly, otherwise through a flow link.
- id: PY_AES_CIPHER
  language: python
  pattern: >-
    \bCipher\(\s*(?:algorithm\s*=\s*)?algorithms\.AES\(\s*(?:key\s*=\s*)?(?:(?P<key_literal>[bB]?"(?:[^"\\]|\\.)*"|[bB]?'(?:[^'\\]|\\.)*')|(?P<key_arg>(?P<key_size_ref>[A-Za-z_]\w*)))\s*\)\s*,\s*(?:mode\s*=\s*)?modes\.(?P<mode>[A-Za-z0-9]+)\(
  raw_name: AES
  kind_hint: algorithm
  usage: encryption
  mode: '{mode}'
  library: cryptography
  key_size_from_length: true
  inherit_key_size: AES

# Cipher(algorithms.AES(key), mode) where the mode is not a modes.X(...) literal (a variable or an
# expression): the AES use is reported with mode None, and its key size from the same key flow as
# PY_AES_CIPHER. Absorbed by PY_AES_CIPHER when the mode is a literal. (outside validation, python-jose)
- id: PY_AES_CIPHER_MODE_UNRESOLVED
  language: python
  pattern: >-
    \bCipher\(\s*(?:algorithm\s*=\s*)?algorithms\.AES\(\s*(?:key\s*=\s*)?(?:(?P<key_literal>[bB]?"(?:[^"\\]|\\.)*"|[bB]?'(?:[^'\\]|\\.)*')|(?P<key_arg>(?P<key_size_ref>[A-Za-z_][\w.]*)))\s*\)
  raw_name: AES
  kind_hint: algorithm
  usage: encryption
  library: cryptography
  key_size_from_length: true
  inherit_key_size: AES
  absorbed_by: [PY_AES_CIPHER]

- id: PY_AESGCM
  language: python
  pattern: >-
    \bAESGCM\(\s*(?:key\s*=\s*)?(?:(?P<key_literal>[bB]?"(?:[^"\\]|\\.)*"|[bB]?'(?:[^'\\]|\\.)*')|(?P<key_arg>(?P<key_size_ref>[A-Za-z_]\w*)))\s*\)
  raw_name: AESGCM
  kind_hint: algorithm
  usage: encryption
  mode: GCM
  library: cryptography
  key_size_from_length: true
  inherit_key_size: AES

# Hard-coded key (M1M3-02, M1M3-04): fires only when a literal reaches an AES key sink, inline, through a
# file-scope constant, a parameter default or call-site arguments. The finding is at the literal's line.
# HMAC keys are outside the rule because HMAC is not an AES sink.
- id: PY_HARDCODED_AES_KEY
  language: python
  pattern: >-
    \b(?:algorithms\.AES|AESGCM)\(\s*(?:key\s*=\s*)?(?:(?P<literal>[bB]?"(?:[^"\\]|\\.)*"|[bB]?'(?:[^'\\]|\\.)*')|(?P<key_arg>[A-Za-z_]\w*))\s*\)
  raw_name: hard-coded symmetric key
  kind_hint: key
  usage: encryption
  library: cryptography
  literal_key: AES
  redact: true
  extra:
    hygiene_only: true
    hygiene_flags: [hardcoded_key]

# ---- insecure RNG -------------------------------------------------------------------------------

# Hygiene warning, not a primitive (M1M3-04). os.urandom and secrets are decoys and have no rule.
- id: PY_INSECURE_RNG
  language: python
  pattern: '\brandom\.(?P<name>getrandbits|randbytes)\('
  raw_name: 'random.{name}'
  kind_hint: algorithm
  usage: rng
  library: random
  extra:
    hygiene_only: true
    hygiene_flags: [insecure_rng]

# ---- PyCryptodome (Crypto.* and Cryptodome.*) -----------------------------------------------------
#
# Names checked on pycryptodome.readthedocs.io, 2026-10-10 (AES.new and MODE_*, DES.new, DES3.new,
# ARC4.new, RSA.generate(bits), DSA.generate(bits), ECC.generate(curve), Crypto.Hash.<NAME>.new,
# HMAC.new(key, msg, digestmod), KDF.PBKDF2(..., hmac_hash_module), pkcs1_15.new, PKCS1_OAEP.new). # verify
#
# Every rule needs a Crypto or Cryptodome mention in the file, so a bare MD5.new( or HMAC.new( of another
# library is not reported. Raw names are the tokens as seen. Documented library defaults are reported with
# extra["parameter_source"] = "library_default" and confidence at most 0.8 (M1 ruling, session 26):
# HMAC.new without digestmod (default MD5), PBKDF2 without prf or hmac_hash_module (default HMAC-SHA1) and
# PBKDF2 without count (default 1000). Checked on pycryptodome.readthedocs.io, 2026-10-10:
# https://pycryptodome.readthedocs.io/en/latest/src/hash/hmac.html  HMAC.new(key, msg=b'', digestmod=None),
#   "Crypto.Hash.MD5" when None;
# https://pycryptodome.readthedocs.io/en/latest/src/protocol/kdf.html  PBKDF2(password, salt, dkLen=16,
#   count=1000, prf=None, hmac_hash_module=None), HMAC-SHA1 when both prf and hmac_hash_module are omitted.
# The pages state no version; PyPI latest on the same date was pycryptodome 3.24.0. # verify

# Key source: get_random_bytes of a named or literal length. Never reported on its own.
- id: PYC_RANDOM_KEY
  language: python
  pattern: '\bget_random_bytes\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*\)'
  raw_name: AES-KEY
  kind_hint: key
  usage: encryption
  key_size_unit: bytes
  provides_key_size: AES
  emit: false

# AES.new(key, AES.MODE_X, ...). The key is an inline literal (its length), a constant or default, or
# traced through a flow link. The mode is the MODE_ token when the call states one, otherwise None.
- id: PYC_AES_NEW
  language: python
  pattern: >-
    \bAES\.new\(\s*(?:key\s*=\s*)?(?:(?P<key_literal>[bB]?"(?:[^"\\]|\\.)*"|[bB]?'(?:[^'\\]|\\.)*')|(?P<key_arg>(?P<key_size_ref>[A-Za-z_]\w*)))(?=\s*[,)])(?=(?:[^()]|\([^()]*\))*?\bAES\.MODE_(?P<mode>[A-Z]+)\b|)
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: AES
  kind_hint: algorithm
  usage: encryption
  mode: '{mode}'
  library: pycryptodome
  key_size_from_length: true
  inherit_key_size: AES

# Hard-coded AES key for AES.new, same contract as PY_HARDCODED_AES_KEY.
- id: PYC_HARDCODED_AES_KEY
  language: python
  pattern: >-
    \bAES\.new\(\s*(?:key\s*=\s*)?(?:(?P<literal>[bB]?"(?:[^"\\]|\\.)*"|[bB]?'(?:[^'\\]|\\.)*')|(?P<key_arg>[A-Za-z_]\w*))\s*[,)]
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: hard-coded symmetric key
  kind_hint: key
  usage: encryption
  library: pycryptodome
  literal_key: AES
  redact: true
  extra:
    hygiene_only: true
    hygiene_flags: [hardcoded_key]

# Legacy and weak symmetric ciphers: the module name is the raw name. No size: the key length is
# not evidence of the cipher's strength here.
- id: PYC_LEGACY_CIPHER
  language: python
  pattern: '\b(?P<name>DES3|DES|ARC4)\.new\('
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: '{name}'
  kind_hint: algorithm
  usage: encryption
  library: pycryptodome

# ---- PyCryptodome asymmetric ---------------------------------------------------------------------

- id: PYC_RSA_GENERATE
  language: python
  pattern: '\bRSA\.generate\(\s*(?:bits\s*=\s*)?(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]'
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: RSA
  kind_hint: algorithm
  usage: unknown
  library: pycryptodome
  provides_key_size: RSA

# Signature and encryption sinks. The key is the first argument: a name, or name.publickey(). Any other
# expression (RSA.import_key(...)) leaves key_arg unset: an unlinked sink blocks the usage inference of
# the file, the same as every RSA sink of the other libraries.
- id: PYC_RSA_PKCS1_15
  language: python
  pattern: >-
    \bpkcs1_15\.new\(\s*(?:rsa_key\s*=\s*)?(?:(?P<key_arg>[A-Za-z_]\w*)(?=\s*(?:[,)]|\.\s*publickey\(\s*\))))?
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: RSA
  kind_hint: algorithm
  usage: signature
  padding: PKCS1v15
  library: pycryptodome
  inherit_key_size: RSA

- id: PYC_RSA_PSS
  language: python
  pattern: >-
    \bpss\.new\(\s*(?:rsa_key\s*=\s*)?(?:(?P<key_arg>[A-Za-z_]\w*)(?=\s*(?:[,)]|\.\s*publickey\(\s*\))))?
  requires: ['\b(?:Crypto|Cryptodome)\b', '\bRSA\b']
  raw_name: RSA
  kind_hint: algorithm
  usage: signature
  padding: PSS
  library: pycryptodome
  inherit_key_size: RSA

- id: PYC_RSA_OAEP
  language: python
  pattern: >-
    \bPKCS1_OAEP\.new\(\s*(?:key\s*=\s*)?(?:(?P<key_arg>[A-Za-z_]\w*)(?=\s*(?:[,)]|\.\s*publickey\(\s*\))))?
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: RSA
  kind_hint: algorithm
  usage: encryption
  padding: OAEP
  library: pycryptodome
  inherit_key_size: RSA

# The legacy PKCS1_v1_5 module name exists in Crypto.Signature (signatures) and Crypto.Cipher
# (encryption). The import decides. A file importing both leaves it unmatched (ambiguous).
- id: PYC_RSA_PKCS1_V1_5_SIGN
  language: python
  pattern: >-
    \bPKCS1_v1_5\.new\(\s*(?:key\s*=\s*)?(?:(?P<key_arg>[A-Za-z_]\w*)(?=\s*(?:[,)]|\.\s*publickey\(\s*\))))?
  requires: ['(?m)^[ \t]*from[ \t]+Crypto(?:dome)?\.Signature[ \t]+import\b[^\n]*\bPKCS1_v1_5\b']
  forbids: ['(?m)^[ \t]*from[ \t]+Crypto(?:dome)?\.Cipher[ \t]+import\b[^\n]*\bPKCS1_v1_5\b']
  raw_name: RSA
  kind_hint: algorithm
  usage: signature
  padding: PKCS1v15
  library: pycryptodome
  inherit_key_size: RSA

- id: PYC_RSA_PKCS1_V1_5_CRYPT
  language: python
  pattern: >-
    \bPKCS1_v1_5\.new\(\s*(?:key\s*=\s*)?(?:(?P<key_arg>[A-Za-z_]\w*)(?=\s*(?:[,)]|\.\s*publickey\(\s*\))))?
  requires: ['(?m)^[ \t]*from[ \t]+Crypto(?:dome)?\.Cipher[ \t]+import\b[^\n]*\bPKCS1_v1_5\b']
  forbids: ['(?m)^[ \t]*from[ \t]+Crypto(?:dome)?\.Signature[ \t]+import\b[^\n]*\bPKCS1_v1_5\b']
  raw_name: RSA
  kind_hint: algorithm
  usage: encryption
  padding: PKCS1v15
  library: pycryptodome
  inherit_key_size: RSA

# DSA signs only. Sizes: a literal, a constant, or bits=.
- id: PYC_DSA_GENERATE
  language: python
  pattern: '\bDSA\.generate\(\s*(?:bits\s*=\s*)?(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*[,)]'
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: DSA
  kind_hint: algorithm
  usage: signature
  library: pycryptodome

# ECC.generate(curve=...): the curve names itself an algorithm for the Edwards and Montgomery curves.
# NIST and other curves are an EC key of unknown usage, curve as seen (the same as ec.SECP256R1).
# The four fixed-curve rules redact the curve literal: the raw name already states it.
# A curve held in a variable resolves through constants, otherwise nothing is emitted.
- id: PYC_ECC_ED25519
  language: python
  pattern: >-
    \bECC\.generate\(\s*(?:curve\s*=\s*)?(?:(?P<q>["'])(?P<curve>[^"']+)(?P=q)|(?P<curve_ref>[A-Za-z_]\w*))
  requires: ['\b(?:Crypto|Cryptodome)\b']
  values_must_match:
    curve: '(?i)ed25519'
  raw_name: Ed25519
  kind_hint: algorithm
  usage: signature
  library: pycryptodome
  redact: true

- id: PYC_ECC_ED448
  language: python
  pattern: >-
    \bECC\.generate\(\s*(?:curve\s*=\s*)?(?:(?P<q>["'])(?P<curve>[^"']+)(?P=q)|(?P<curve_ref>[A-Za-z_]\w*))
  requires: ['\b(?:Crypto|Cryptodome)\b']
  values_must_match:
    curve: '(?i)ed448'
  raw_name: Ed448
  kind_hint: algorithm
  usage: signature
  library: pycryptodome
  redact: true

- id: PYC_ECC_CURVE25519
  language: python
  pattern: >-
    \bECC\.generate\(\s*(?:curve\s*=\s*)?(?:(?P<q>["'])(?P<curve>[^"']+)(?P=q)|(?P<curve_ref>[A-Za-z_]\w*))
  requires: ['\b(?:Crypto|Cryptodome)\b']
  values_must_match:
    curve: '(?i)curve25519'
  raw_name: X25519
  kind_hint: algorithm
  usage: key_exchange
  library: pycryptodome
  redact: true

- id: PYC_ECC_CURVE448
  language: python
  pattern: >-
    \bECC\.generate\(\s*(?:curve\s*=\s*)?(?:(?P<q>["'])(?P<curve>[^"']+)(?P=q)|(?P<curve_ref>[A-Za-z_]\w*))
  requires: ['\b(?:Crypto|Cryptodome)\b']
  values_must_match:
    curve: '(?i)curve448'
  raw_name: X448
  kind_hint: algorithm
  usage: key_exchange
  library: pycryptodome
  redact: true

- id: PYC_ECC_GENERATE
  language: python
  pattern: >-
    \bECC\.generate\(\s*(?:curve\s*=\s*)?(?:(?P<q>["'])(?P<curve>[^"']+)(?P=q)|(?P<curve_ref>[A-Za-z_]\w*))
  requires: ['\b(?:Crypto|Cryptodome)\b']
  values_must_match:
    curve: '(?i)(?!(?:ed25519|ed448|curve25519|curve448)$).+'
  raw_name: EC
  kind_hint: algorithm
  usage: unknown
  curve: '{curve}'
  library: pycryptodome

# ---- PyCryptodome hashes, HMAC and PBKDF2 --------------------------------------------------------

- id: PYC_HASH
  language: python
  pattern: >-
    \b(?P<name>MD2|MD5|SHA1|SHA224|SHA256|SHA384|SHA512|SHA3_224|SHA3_256|SHA3_384|SHA3_512|RIPEMD160|BLAKE2b|BLAKE2s)\.new\(
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: pycryptodome

# HMAC.new(key, msg, digestmod=SHA256) or digestmod as the third positional argument. Without a
# digestmod the library default applies: see PYC_HMAC_DEFAULT.
- id: PYC_HMAC
  language: python
  pattern: >-
    \bHMAC\.new\((?:(?:[^()]|\([^()]*\))*?\bdigestmod\s*=\s*|(?:\s*(?:[^,()=]|\([^()]*\))+,){2}\s*)(?P<name>MD5|SHA1|SHA224|SHA256|SHA384|SHA512|SHA3_224|SHA3_256|SHA3_384|SHA3_512|RIPEMD160)\b
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: 'HMAC-{name}'
  kind_hint: algorithm
  usage: mac
  library: pycryptodome

# KDF.PBKDF2(password, salt, dkLen, count, prf, hmac_hash_module): the hash module is the keyword or
# the sixth positional argument. A prf callable or no hash argument emits nothing.
- id: PYC_PBKDF2
  language: python
  pattern: >-
    \bPBKDF2\((?P<call>)(?:(?:[^()]|\([^()]*\))*?\bhmac_hash_module\s*=\s*|(?:\s*(?:[^,()=]|\([^()]*\))+,){5}\s*)(?P<name>SHA1|SHA224|SHA256|SHA384|SHA512|SHA3_224|SHA3_256|SHA3_384|SHA3_512)\b
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: 'PBKDF2-HMAC-{name}'
  kind_hint: algorithm
  usage: kdf
  library: pycryptodome
  iterations: {arg: 3, keyword: count, default: 1000}

# HMAC.new(key[, msg]) with no digestmod (keyword or third positional): the library default is MD5.
# Documented default, so the hash is reported with parameter_source library_default (see the header).
- id: PYC_HMAC_DEFAULT
  language: python
  pattern: >-
    \bHMAC\.new\((?!\s*\*)\s*(?:key\s*=\s*)?(?:[^,()=]|\([^()]*\))+(?:,(?!\s*\*)\s*(?:msg\s*=\s*)?(?:[^,()=]|\([^()]*\))+)?\s*\)
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: HMAC-MD5
  kind_hint: algorithm
  usage: mac
  library: pycryptodome
  confidence: 0.8
  parameter_source: library_default

# KDF.PBKDF2(password, salt[, dkLen[, count]]) with no prf and no hmac_hash_module: the library default
# is HMAC-SHA1. The count defaults to 1000 when it is not stated (iterations.default, same source flag).
- id: PYC_PBKDF2_DEFAULT
  language: python
  pattern: >-
    \bPBKDF2\((?P<call>)(?!\s*(?:\*|(?:prf|hmac_hash_module)\s*=))\s*(?:[A-Za-z_]\w*\s*=\s*)?(?:[^,()=]|\([^()]*\))+(?:,(?!\s*(?:\*|(?:prf|hmac_hash_module)\s*=))\s*(?:[A-Za-z_]\w*\s*=\s*)?(?:[^,()=]|\([^()]*\))+){1,3}\s*\)
  requires: ['\b(?:Crypto|Cryptodome)\b']
  raw_name: PBKDF2-HMAC-SHA1
  kind_hint: algorithm
  usage: kdf
  library: pycryptodome
  confidence: 0.8
  parameter_source: library_default
  iterations: {arg: 3, keyword: count, default: 1000}

# ---- configured obsolete TLS and SSL versions (M3M4-09, M1M3-16) --------------------------------

# A reference to the ssl module's legacy protocol constants or TLSVersion members. raw_name is one
# spelling per version ("TLS 1.0", "TLS 1.1", "SSLv3"), the name the network scanner uses, so one asset
# per version; the constant as written goes in extra["source_constant"]. kind_hint protocol_version:
# the engine marks it classically broken and keeps it out of the score. Constants that disable a
# version (ssl.OP_NO_TLSv1), PROTOCOL_TLS, PROTOCOL_TLS_CLIENT and PROTOCOL_SSLv23 emit nothing.
# Names checked on docs.python.org/3/library/ssl.html, 2026-10-10. # verify
- id: PY_TLS_10
  language: python
  pattern: '\bssl\.(?P<const>PROTOCOL_TLSv1|TLSVersion\.TLSv1)\b'
  raw_name: TLS 1.0
  kind_hint: protocol_version
  usage: unknown
  library: ssl
  extra:
    source_constant: 'ssl.{const}'

- id: PY_TLS_11
  language: python
  pattern: '\bssl\.(?P<const>PROTOCOL_TLSv1_1|TLSVersion\.TLSv1_1)\b'
  raw_name: TLS 1.1
  kind_hint: protocol_version
  usage: unknown
  library: ssl
  extra:
    source_constant: 'ssl.{const}'

- id: PY_SSL_30
  language: python
  pattern: '\bssl\.(?P<const>PROTOCOL_SSLv3|TLSVersion\.SSLv3)\b'
  raw_name: SSLv3
  kind_hint: protocol_version
  usage: unknown
  library: ssl
  extra:
    source_constant: 'ssl.{const}'

# ---- references: names used, not called (outside validation F4, F5) ------------------------------
# reference: true caps confidence at 0.6 and drops the hit when a call finding of the same file has the
# same raw name (the call wins, as for import-only findings).

# A cipher class named without being instantiated, for example a negotiation table such as paramiko
# transport.py {"class": algorithms.AES, ...}. The key size is not known, so AES stays unsized. An
# attribute read (algorithms.AES.block_size) is not a use and is not reported.
- id: PY_CIPHER_CLASS_REFERENCE
  language: python
  pattern: '\balgorithms\.(?P<name>AES|AES128|AES256|TripleDES|ARC4|Blowfish|Camellia|ChaCha20|IDEA|SEED|SM4|CAST5)\b(?!\s*[(.])'
  requires: ['\bcryptography\b']
  raw_name: '{name}'
  kind_hint: algorithm
  usage: encryption
  library: cryptography
  reference: true

# A cipher class imported by name (paramiko: from cryptography.hazmat.decrepit.ciphers.algorithms import
# TripleDES), then used bare. The module path is written with [.] because it is an import line, not a
# call qualifier for python_ast.py. One name per import statement.
- id: PY_CIPHER_CLASS_IMPORT
  language: python
  pattern: '\bfrom\s+cryptography[.]hazmat[.](?:primitives|decrepit)[.]ciphers[.]algorithms\s+import\s+\(?[^\n]*?\b(?P<name>AES|AES128|AES256|TripleDES|ARC4|Blowfish|Camellia|ChaCha20|IDEA|SEED|SM4|CAST5)\b'
  raw_name: '{name}'
  kind_hint: algorithm
  usage: encryption
  library: cryptography
  reference: true

# JOSE algorithm names (RFC 7518) as string literals in a file that uses a JWT/JOSE library or defines a
# JOSE name table (python-jose constants.py: HS256 = "HS256"). HS* are
# MACs; RS*, PS*, ES* and EdDSA are signatures. The engine decomposes the names.
- id: PY_JOSE_HMAC
  language: python
  pattern: '(?P<q>["''])(?P<name>HS(?:256|384|512))(?P=q)'
  requires: ['\b(?:jwt|jose|jws|jwk|authlib|jwcrypto)\b|\b(?:HS|RS|ES|PS)(?:256|384|512)\s*=\s*["''](?:HS|RS|ES|PS)(?:256|384|512)["'']']
  raw_name: '{name}'
  kind_hint: algorithm
  usage: mac
  library: jose
  reference: true

- id: PY_JOSE_SIGNATURE
  language: python
  pattern: '(?P<q>["''])(?P<name>(?:RS|PS|ES)(?:256|384|512)|ES256K|EdDSA)(?P=q)'
  requires: ['\b(?:jwt|jose|jws|jwk|authlib|jwcrypto)\b|\b(?:HS|RS|ES|PS)(?:256|384|512)\s*=\s*["''](?:HS|RS|ES|PS)(?:256|384|512)["'']']
  raw_name: '{name}'
  kind_hint: algorithm
  usage: signature
  library: jose
  reference: true
