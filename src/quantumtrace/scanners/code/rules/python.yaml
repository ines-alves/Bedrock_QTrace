# Python rules for the code scanner. Field reference: the module docstring of engine.py.
#
# raw_name is the algorithm token as it appears in the code (M1M3-03). Where the call carries no
# single token (module or class based APIs, composites) the scanner joins the observed tokens with
# "-" and the engine normalizer maps the result. Nothing here assigns a tier.
#
# Scope today: the starter-kit scenarios and their SAFE decoys. Wider library coverage comes later.

# ---- hashes -------------------------------------------------------------------------------------

- id: PY_HASHLIB
  language: python
  pattern: '\bhashlib\.(?P<name>md5|sha1|sha224|sha256|sha384|sha512)\('
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: hashlib

# hashlib.new(name): the name is a literal or a file-scope constant or parameter default. Anything else
# (an unresolved identifier, an algorithm outside the list) emits nothing, see values_must_match.
- id: PY_HASHLIB_NEW
  language: python
  pattern: >-
    \bhashlib\.new\(\s*(?:[bB]?["'](?P<name>(?i:md5|sha1|sha224|sha256|sha384|sha512))["']|(?P<name_ref>[A-Za-z_]\w*))\s*[,)]
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: hashlib
  values_must_match:
    name: '(?i)md5|sha1|sha224|sha256|sha384|sha512'

# A hash class inside a PBKDF2HMAC(...) call is part of that composite and is not reported twice
# (absorbed_by: the match of PY_PBKDF2 runs from PBKDF2HMAC( to the hash). The same class handed to
# HKDF, OAEP or any other call is reported.
- id: PY_CRYPTOGRAPHY_HASH
  language: python
  pattern: '\bhashes\.(?P<name>MD5|SHA1|SHA224|SHA256|SHA384|SHA512)\(\)'
  absorbed_by: [PY_PBKDF2]
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: cryptography

# ---- MAC and KDF --------------------------------------------------------------------------------

- id: PY_HMAC
  language: python
  pattern: >-
    \bhmac\.new\((?:\s*(?:[^,()]|\([^()]*\))+,){1,2}\s*(?:digestmod\s*=\s*)?hashlib\.(?P<name>md5|sha1|sha224|sha256|sha384|sha512)\b
  raw_name: 'HMAC-{name}'
  kind_hint: algorithm
  usage: mac
  library: hmac

# digestmod given as a string: hmac.new(k, m, "sha1") or hmac.new(k, m, digestmod="sha1"). A digest
# named through a variable bound to hashlib.sha1 is not followed (known gap).
- id: PY_HMAC_STRING
  language: python
  pattern: >-
    \bhmac\.new\((?:(?:\s*(?:[^,()]|\([^()]*\))+,){2}|(?:\s*(?:[^,()]|\([^()]*\))+,){1,2}\s*digestmod\s*=)\s*(?P<q>["'])(?P<name>(?i:md5|sha1|sha224|sha256|sha384|sha512))(?P=q)
  raw_name: 'HMAC-{name}'
  kind_hint: algorithm
  usage: mac
  library: hmac

# A positional first argument (PBKDF2HMAC(hashes.SHA1(), ...)) is given the algorithm= keyword in the
# masked text by python_ast.py before this rule runs.
- id: PY_PBKDF2
  language: python
  pattern: >-
    \bPBKDF2HMAC\((?:[^()]|\([^()]*\))*?\balgorithm\s*=\s*hashes\.(?P<name>[A-Za-z0-9_]+)\(\)
  raw_name: 'PBKDF2-HMAC-{name}'
  kind_hint: algorithm
  usage: kdf
  library: cryptography

# ---- RSA ----------------------------------------------------------------------------------------

# Key generation carries the size. The usage is not known from a generation call.
- id: PY_RSA_GENERATE
  language: python
  pattern: >-
    \brsa\.generate_private_key\((?:[^()]|\([^()]*\))*?\bkey_size\s*=\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))
  raw_name: RSA
  kind_hint: algorithm
  usage: unknown
  library: cryptography
  provides_key_size: RSA

- id: PY_RSA_GENERATE_POSITIONAL
  language: python
  pattern: '\brsa\.generate_private_key\(\s*\d+\s*,\s*(?P<key_size>\d+)'
  raw_name: RSA
  kind_hint: algorithm
  usage: unknown
  library: cryptography
  provides_key_size: RSA

# Sign and verify sites carry no size of their own. The padding argument separates RSA from ECDSA and
# Ed25519, which have the same method names. The size comes only through a demonstrated flow link.
- id: PY_RSA_SIGN_VERIFY
  language: python
  pattern: >-
    (?P<key_arg>[A-Za-z_]\w*)\s*\.\s*(?:sign|verify)\((?:[^()]|\([^()]*\))*?\bpadding\.(?P<pad>PKCS1v15|PSS)\(
  raw_name: RSA
  kind_hint: algorithm
  usage: signature
  padding: '{pad}'
  library: cryptography
  inherit_key_size: RSA

# RSA encryption sinks exist so that a generated key used for encryption is never reported as a signing
# key. The padding argument (OAEP or PKCS1v15) separates RSA from other key types with an encrypt method.
# The receiver may be a name or name.public_key().
- id: PY_RSA_ENCRYPT_DECRYPT
  language: python
  pattern: >-
    (?P<key_arg>[A-Za-z_]\w*)(?:\s*\.\s*public_key\(\s*\))?\s*\.\s*(?:encrypt|decrypt)\((?:[^()]|\([^()]*\))*?\bpadding\.(?P<pad>OAEP|PKCS1v15)\(
  raw_name: RSA
  kind_hint: algorithm
  usage: encryption
  padding: '{pad}'
  library: cryptography
  inherit_key_size: RSA

# ---- Ed25519 ------------------------------------------------------------------------------------

- id: PY_ED25519_GENERATE
  language: python
  pattern: '\b(?:ed25519\.)?Ed25519PrivateKey\.generate\(\)'
  raw_name: Ed25519
  kind_hint: algorithm
  usage: signature
  library: cryptography

# ---- X25519, X448, ECDH -------------------------------------------------------------------------

# Key agreement only. Generating or loading a private key, or loading a peer public key, is evidence.
# X25519PrivateKey and friends are written bare (python_ast.BARE_MEMBERS), the module prefix is optional.
- id: PY_X25519
  language: python
  pattern: >-
    \b(?:x25519\.)?(?:X25519PrivateKey\.(?:generate|from_private_bytes)|X25519PublicKey\.from_public_bytes)\(
  raw_name: X25519
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

- id: PY_X448
  language: python
  pattern: >-
    \b(?:x448\.)?(?:X448PrivateKey\.(?:generate|from_private_bytes)|X448PublicKey\.from_public_bytes)\(
  raw_name: X448
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

# private_key.exchange(ec.ECDH(), peer_public_key). The curve comes from the key, not from this call, so
# none is reported here (the EC key rules carry it).
- id: PY_ECDH
  language: python
  pattern: '\bec\.ECDH\(\)'
  raw_name: ECDH
  kind_hint: algorithm
  usage: key_exchange
  library: cryptography

# ---- EC keys and ECDSA --------------------------------------------------------------------------

# A named curve class is the evidence of an EC key (generate_private_key, derive_private_key,
# from_encoded_point, public numbers all take one), so the curve class is matched instead of each
# consumer. The usage is not known from the curve: raw_name EC, usage unknown. The curve classes are
# the cryptography.hazmat.primitives.asymmetric.ec names (SECP, SECT, Brainpool families). # verify
- id: PY_EC_CURVE
  language: python
  pattern: '\bec\.(?P<curve>SECP(?:192R1|224R1|256K1|256R1|384R1|521R1)|SECT(?:163K1|163R2|233[KR]1|283[KR]1|409[KR]1|571[KR]1)|BrainpoolP(?:256|384|512)R1)\b'
  raw_name: EC
  kind_hint: algorithm
  usage: unknown
  curve: '{curve}'
  library: cryptography

# ec.ECDSA(hash) is the signature algorithm argument of sign and verify. The curve belongs to the key.
- id: PY_ECDSA
  language: python
  pattern: '\bec\.ECDSA\('
  raw_name: ECDSA
  kind_hint: algorithm
  usage: signature
  library: cryptography

# ---- AES ----------------------------------------------------------------------------------------

# Key source: os.urandom of a named or literal length. Never reported on its own.
- id: PY_URANDOM_KEY
  language: python
  pattern: '\bos\.urandom\(\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*\)'
  raw_name: AES-KEY
  kind_hint: key
  usage: encryption
  key_size_unit: bytes
  provides_key_size: AES
  emit: false

# Cipher(algorithms.AES(key), modes.X(...)), algorithm and mode positional or keyword. The mode is
# stated by the call. The key size comes from
# a parameter default or constant directly, otherwise through a flow link.
- id: PY_AES_CIPHER
  language: python
  pattern: >-
    \bCipher\(\s*(?:algorithm\s*=\s*)?algorithms\.AES\(\s*(?P<key_arg>(?P<key_size_ref>[A-Za-z_]\w*))\s*\)\s*,\s*(?:mode\s*=\s*)?modes\.(?P<mode>[A-Za-z0-9]+)\(
  raw_name: AES
  kind_hint: algorithm
  usage: encryption
  mode: '{mode}'
  library: cryptography
  key_size_from_length: true
  inherit_key_size: AES

- id: PY_AESGCM
  language: python
  pattern: '\bAESGCM\(\s*(?P<key_arg>(?P<key_size_ref>[A-Za-z_]\w*))\s*\)'
  raw_name: AESGCM
  kind_hint: algorithm
  usage: encryption
  mode: GCM
  library: cryptography
  key_size_from_length: true
  inherit_key_size: AES

# Hard-coded key (M1M3-02, M1M3-04): fires only when a literal reaches an AES key sink, inline, through a
# file-scope constant, a parameter default or call-site arguments. The finding is at the literal's line.
# HMAC keys are outside the rule because HMAC is not an AES sink.
- id: PY_HARDCODED_AES_KEY
  language: python
  pattern: >-
    \b(?:algorithms\.AES|AESGCM)\(\s*(?:(?P<literal>[bB]?"(?:[^"\\]|\\.)*"|[bB]?'(?:[^'\\]|\\.)*')|(?P<key_arg>[A-Za-z_]\w*))\s*\)
  raw_name: hard-coded symmetric key
  kind_hint: key
  usage: encryption
  library: cryptography
  literal_key: AES
  redact: true
  extra:
    hygiene_only: true
    hygiene_flags: [hardcoded_key]

# ---- insecure RNG -------------------------------------------------------------------------------

# Hygiene warning, not a primitive (M1M3-04). os.urandom and secrets are decoys and have no rule.
- id: PY_INSECURE_RNG
  language: python
  pattern: '\brandom\.(?P<name>getrandbits|randbytes)\('
  raw_name: 'random.{name}'
  kind_hint: algorithm
  usage: rng
  library: random
  extra:
    hygiene_only: true
    hygiene_flags: [insecure_rng]
