# ---- JOSE names (outside validation F5) ---------------------------------------------------------
# golang-jwt SigningMethodRS256 and go-jose constants (jose.RS256). HS* are MACs. reference: true
# caps confidence at 0.6 and drops the hit when a call of the same file reports the same name.
- id: GO_JOSE_HMAC
  language: go
  pattern: '\b(?:jwt\.SigningMethod|jose\.)(?P<name>HS(?:256|384|512))\b'
  raw_name: '{name}'
  kind_hint: algorithm
  usage: mac
  library: jose
  reference: true

- id: GO_JOSE_SIGNATURE
  language: go
  pattern: '\b(?:jwt\.SigningMethod|jose\.)(?P<name>(?:RS|PS|ES)(?:256|384|512)|EdDSA)\b'
  raw_name: '{name}'
  kind_hint: algorithm
  usage: signature
  library: jose
  reference: true

# ---- HMAC with a hash chosen at run time (tool comparison, go-jose / golang-jwt) ------------------
# hmac.New(ctx.hash, key) or hmac.New(m.Hash.New, key): the hash is not a crypto/<hash> constructor, so
# GO_HMAC cannot name it. The MAC is still reported, raw name HMAC (unresolved hash), confidence 0.5.
- id: GO_HMAC_UNRESOLVED
  language: go
  pattern: '\bhmac\.New\(\s*(?!(?:md5|sha1|sha256|sha512|sha3)\.)(?P<argument>[A-Za-z_][\w.]*(?:\([^()]*\))?)\s*,'
  requires: ['"crypto/hmac"']
  raw_name: HMAC
  kind_hint: algorithm
  usage: mac
  library: crypto/hmac
  only_unresolved: true

# ---- private keys embedded in source (tool comparison: cbomkit-theia, cryptosweep) ----------------
# A PEM private-key header in a string (comments are masked first). The key itself is never read or
# shown (redact: true); the type comes from the label, and a bare, ENCRYPTED or OPENSSH header is
# "unresolved". The engine adds the private_key_material hygiene action.
- id: GO_EMBEDDED_PRIVATE_KEY_TYPED
  language: go
  pattern: '-----BEGIN (?P<algo>RSA|EC|DSA) PRIVATE KEY-----'
  raw_name: '{algo}'
  kind_hint: key
  usage: unknown
  redact: true
  extra:
    object: embedded_private_key
    hygiene_flags: [private_key_material]

- id: GO_EMBEDDED_PRIVATE_KEY
  language: go
  pattern: '-----BEGIN (?:ENCRYPTED |OPENSSH )?PRIVATE KEY-----'
  raw_name: unresolved
  kind_hint: key
  usage: unknown
  confidence: 0.5
  redact: true
  extra:
    object: embedded_private_key
    hygiene_flags: [private_key_material]
