# Go rules for the code scanner. Field reference: the module docstring of engine.py.
#
# raw_name is the token as it appears in the code (M1M3-03): the package name for hashes (md5, sha1,
# sha256), crypto.<NAME> constants as seen (SHA1), joined composites (HMAC-sha256) and the algorithm
# name for module based APIs (RSA, Ed25519, AES). sha512.Sum384 and sha512.New384 are reported as
# sha384. The hand-rolled PBKDF2 name is fixed by M1M3-05. Nothing here assigns a tier.
#
# Call detection works on the qualifier as written (aes.NewCipher). An aliased import is not tracked
# for calls; it is reported by the import-only rules at confidence 0.6.
#
# Import-only findings (PLAN 3.6): the import line is reported only when the file never calls what
# the call rules of that package detect. The `forbids` of each import rule lists those calls, so a
# call finding always wins and crypto/sha256 imported only for HMAC or PBKDF2 stays silent.
#
# Scope today: the starter-kit scenarios and their SAFE decoys, plus crypto/ecdsa, crypto/ecdh,
# x/crypto/curve25519 and crypto/mlkem. Not covered: crypto/dsa, crypto/tls curve preferences,
# elliptic.P256() outside ecdsa.GenerateKey, key loading (x509, ParseRawPrivateKey).

# ---- hashes -------------------------------------------------------------------------------------

- id: GO_MD5
  language: go
  pattern: '\bmd5\.(?:Sum|New)\('
  raw_name: md5
  kind_hint: algorithm
  usage: hash
  library: crypto/md5

- id: GO_SHA1
  language: go
  pattern: '\bsha1\.(?:Sum|New)\('
  raw_name: sha1
  kind_hint: algorithm
  usage: hash
  library: crypto/sha1

- id: GO_SHA224
  language: go
  pattern: '\bsha256\.(?:Sum224|New224)\('
  raw_name: sha224
  kind_hint: algorithm
  usage: hash
  library: crypto/sha256

# sha256.New passed to hmac.New or pbkdf2.Key has no parentheses and belongs to those composites.
- id: GO_SHA256
  language: go
  pattern: '\bsha256\.(?:Sum256|New)\('
  raw_name: sha256
  kind_hint: algorithm
  usage: hash
  library: crypto/sha256

- id: GO_SHA384
  language: go
  pattern: '\bsha512\.(?:Sum384|New384)\('
  raw_name: sha384
  kind_hint: algorithm
  usage: hash
  library: crypto/sha512

- id: GO_SHA512
  language: go
  pattern: '\bsha512\.(?:Sum512|New)\('
  raw_name: sha512
  kind_hint: algorithm
  usage: hash
  library: crypto/sha512

# A crypto.Hash constant naming the digest of a signature call (rsa.SignPKCS1v15(..., crypto.SHA1, ...)).
- id: GO_CRYPTO_HASH_CONST
  language: go
  pattern: '\bcrypto\.(?P<name>MD5|SHA1|SHA224|SHA256|SHA384|SHA512)\b'
  raw_name: '{name}'
  kind_hint: algorithm
  usage: hash
  library: crypto

# ---- HMAC and PBKDF2 ----------------------------------------------------------------------------

# A hash constructor handed to hmac.New is part of that composite and is not reported separately.
# A function that feeds the HMAC output back and XOR-accumulates blocks is a hand-rolled PBKDF2 and is
# reported below, not here.
- id: GO_HMAC
  language: go
  pattern: '\bhmac\.New\(\s*(?P<name>md5|sha1|sha256|sha512)\.New\s*,'
  raw_name: 'HMAC-{name}'
  kind_hint: algorithm
  usage: mac
  library: crypto/hmac
  scope: function
  forbids: ['(?s)\A(?=.*?\b(?P<arr>[A-Za-z_]\w*)\[(?P<idx>[A-Za-z_]\w*)\]\s*(?:\^=|=\s*(?P=arr)\[(?P=idx)\]\s*\^))(?=.*?\b(?P<u>[A-Za-z_]\w*)\s*:?=\s*[A-Za-z_]\w*\.Sum\(.*?\.Write\(\s*(?P=u)\s*\))']

- id: GO_HMAC_SHA224
  language: go
  pattern: '\bhmac\.New\(\s*sha256\.New224\s*,'
  raw_name: HMAC-sha224
  kind_hint: algorithm
  usage: mac
  library: crypto/hmac
  scope: function
  forbids: ['(?s)\A(?=.*?\b(?P<arr>[A-Za-z_]\w*)\[(?P<idx>[A-Za-z_]\w*)\]\s*(?:\^=|=\s*(?P=arr)\[(?P=idx)\]\s*\^))(?=.*?\b(?P<u>[A-Za-z_]\w*)\s*:?=\s*[A-Za-z_]\w*\.Sum\(.*?\.Write\(\s*(?P=u)\s*\))']

- id: GO_HMAC_SHA384
  language: go
  pattern: '\bhmac\.New\(\s*sha512\.New384\s*,'
  raw_name: HMAC-sha384
  kind_hint: algorithm
  usage: mac
  library: crypto/hmac
  scope: function
  forbids: ['(?s)\A(?=.*?\b(?P<arr>[A-Za-z_]\w*)\[(?P<idx>[A-Za-z_]\w*)\]\s*(?:\^=|=\s*(?P=arr)\[(?P=idx)\]\s*\^))(?=.*?\b(?P<u>[A-Za-z_]\w*)\s*:?=\s*[A-Za-z_]\w*\.Sum\(.*?\.Write\(\s*(?P=u)\s*\))']

# Hand-rolled PBKDF2 (M1M3-05, M1M3-08): HMAC in an iteration loop whose output blocks are XORed,
# with no pbkdf2 call. Every hmac.New of the function is evidence of the same asset; the first is the
# anchor. Two things must hold in the same function: an HMAC output that is written back into the HMAC
# (u := mac.Sum(nil) ... mac.Write(u)) and an indexed XOR accumulation (t[j] ^= u[j], or t[j] = t[j] ^ u[j]).
# A loop and a "^" alone are not enough (a constant-time tag compare has both). The rule is a heuristic,
# so its confidence is at most 0.8. GO_HMAC and its variants forbid the same two conditions.
- id: GO_PBKDF2_HAND_ROLLED_SHA256
  language: go
  pattern: '\bhmac\.New\(\s*sha256\.New\s*,'
  raw_name: PBKDF2-HMAC-SHA256
  kind_hint: algorithm
  usage: kdf
  library: crypto/hmac
  scope: function
  confidence: 0.8
  iterations: {loop_param: true}
  requires:
    - '\b(?P<arr>[A-Za-z_]\w*)\[(?P<idx>[A-Za-z_]\w*)\]\s*(?:\^=|=\s*(?P=arr)\[(?P=idx)\]\s*\^)'
    - '(?s)\b(?P<u>[A-Za-z_]\w*)\s*:?=\s*[A-Za-z_]\w*\.Sum\(.*?\.Write\(\s*(?P=u)\s*\)'
  forbids: ['\bpbkdf2\.Key\(']
  extra:
    hand_rolled: true

- id: GO_PBKDF2_HAND_ROLLED_SHA1
  language: go
  pattern: '\bhmac\.New\(\s*sha1\.New\s*,'
  raw_name: PBKDF2-HMAC-SHA1
  kind_hint: algorithm
  usage: kdf
  library: crypto/hmac
  scope: function
  confidence: 0.8
  iterations: {loop_param: true}
  requires:
    - '\b(?P<arr>[A-Za-z_]\w*)\[(?P<idx>[A-Za-z_]\w*)\]\s*(?:\^=|=\s*(?P=arr)\[(?P=idx)\]\s*\^)'
    - '(?s)\b(?P<u>[A-Za-z_]\w*)\s*:?=\s*[A-Za-z_]\w*\.Sum\(.*?\.Write\(\s*(?P=u)\s*\)'
  forbids: ['\bpbkdf2\.Key\(']
  extra:
    hand_rolled: true

- id: GO_PBKDF2_HAND_ROLLED_SHA512
  language: go
  pattern: '\bhmac\.New\(\s*sha512\.New\s*,'
  raw_name: PBKDF2-HMAC-SHA512
  kind_hint: algorithm
  usage: kdf
  library: crypto/hmac
  scope: function
  confidence: 0.8
  iterations: {loop_param: true}
  requires:
    - '\b(?P<arr>[A-Za-z_]\w*)\[(?P<idx>[A-Za-z_]\w*)\]\s*(?:\^=|=\s*(?P=arr)\[(?P=idx)\]\s*\^)'
    - '(?s)\b(?P<u>[A-Za-z_]\w*)\s*:?=\s*[A-Za-z_]\w*\.Sum\(.*?\.Write\(\s*(?P=u)\s*\)'
  forbids: ['\bpbkdf2\.Key\(']
  extra:
    hand_rolled: true

# The library call: golang.org/x/crypto/pbkdf2 (or crypto/pbkdf2). The hash is the fifth argument.
- id: GO_PBKDF2_LIBRARY
  language: go
  pattern: '\bpbkdf2\.Key\((?P<call>)(?:[^(),]|\([^()]*\))+,(?:[^(),]|\([^()]*\))+,[^,]+,[^,]+,\s*(?P<name>md5|sha1|sha256|sha512)\.New\b'
  raw_name: 'PBKDF2-HMAC-{name}'
  kind_hint: algorithm
  usage: kdf
  library: pbkdf2
  iterations: {arg: 2}

# crypto/pbkdf2 (Go 1.24) takes the hash first: pbkdf2.Key(sha256.New, password, salt, iter, keyLen).
- id: GO_PBKDF2_STDLIB
  language: go
  pattern: '\bpbkdf2\.Key\((?P<call>)\s*(?P<name>md5|sha1|sha256|sha512)\.New\b'
  raw_name: 'PBKDF2-HMAC-{name}'
  kind_hint: algorithm
  usage: kdf
  library: crypto/pbkdf2
  iterations: {arg: 3}

# ---- RSA ----------------------------------------------------------------------------------------

# Key generation carries the size. The usage is not known from a generation call. A size that is an
# expression (kr.Size(), *bits, c.Int("keysize")) still reports RSA, with no size.
- id: GO_RSA_GENERATE
  language: go
  pattern: '\brsa\.GenerateKey\(\s*[^,()]+,\s*(?:(?P<key_size>\d+)\s*\)|(?P<key_size_ref>[A-Za-z_]\w*)\s*\)|)'
  raw_name: RSA
  kind_hint: algorithm
  usage: unknown
  library: crypto/rsa
  provides_key_size: RSA

# Sign sites take the private key as second argument. The size comes only through a flow link.
- id: GO_RSA_SIGN
  language: go
  pattern: '\brsa\.Sign(?P<pad>PKCS1v15|PSS)\(\s*[^,()]+,\s*(?P<key_arg>[A-Za-z_]\w*)(?:\.\w+)*\s*,'
  raw_name: RSA
  kind_hint: algorithm
  usage: signature
  padding: '{pad}'
  library: crypto/rsa
  inherit_key_size: RSA

# Verify sites take the public key as first argument.
- id: GO_RSA_VERIFY
  language: go
  pattern: '\brsa\.Verify(?P<pad>PKCS1v15|PSS)\(\s*[&*]?\s*(?P<key_arg>[A-Za-z_]\w*)\b'
  raw_name: RSA
  kind_hint: algorithm
  usage: signature
  padding: '{pad}'
  library: crypto/rsa
  inherit_key_size: RSA

# Encrypt and decrypt sinks exist so that a generated key used for encryption is never reported as a
# signing key. OAEP takes the key as third argument, PKCS1v15 (and DecryptPKCS1v15SessionKey) as second.
# The first OAEP argument is usually a call (sha256.New()).
- id: GO_RSA_OAEP
  language: go
  pattern: >-
    \brsa\.(?:Encrypt|Decrypt)OAEP\(\s*(?:[^,()]|\([^()]*\))+,\s*(?:[^,()]|\([^()]*\))+,\s*[&*]?\s*(?P<key_arg>[A-Za-z_]\w*)\b
  raw_name: RSA
  kind_hint: algorithm
  usage: encryption
  padding: OAEP
  library: crypto/rsa
  inherit_key_size: RSA

- id: GO_RSA_PKCS1V15_CRYPT
  language: go
  pattern: >-
    \brsa\.(?:Encrypt|Decrypt)PKCS1v15(?:SessionKey)?\(\s*(?:[^,()]|\([^()]*\))+,\s*[&*]?\s*(?P<key_arg>[A-Za-z_]\w*)\b
  raw_name: RSA
  kind_hint: algorithm
  usage: encryption
  padding: PKCS1v15
  library: crypto/rsa
  inherit_key_size: RSA

# ---- Ed25519 ------------------------------------------------------------------------------------

- id: GO_ED25519
  language: go
  pattern: '\bed25519\.(?:GenerateKey|NewKeyFromSeed|Sign|Verify)\('
  raw_name: Ed25519
  kind_hint: algorithm
  usage: signature
  library: crypto/ed25519

# ---- EC, key agreement and ML-KEM (task 6, Go slice) --------------------------------------------

# crypto/ecdsa. The usage is the algorithm's own: ECDSA signs. The curve is reported only when it is
# the elliptic.PNNN() constructor in the call (as seen: P256); a curve held in a variable gives ECDSA
# with no curve. Names checked on pkg.go.dev/crypto/ecdsa, 2026-10-10. # verify
- id: GO_ECDSA_GENERATE
  language: go
  pattern: '\becdsa\.GenerateKey\(\s*(?:elliptic\.(?P<curve>P224|P256|P384|P521)\(\))?'
  raw_name: ECDSA
  kind_hint: algorithm
  usage: signature
  curve: '{curve}'
  library: crypto/ecdsa

# crypto/elliptic key generation and point encoding (ECDH in hand-rolled TLS code, cfssl): the curve is
# reported only for an inline elliptic.PNNN() constructor; usage is not known from the call. Names
# checked on pkg.go.dev/crypto/elliptic, 2026-10-11.
- id: GO_ELLIPTIC
  language: go
  pattern: '\belliptic\.(?:GenerateKey|Marshal|MarshalCompressed|Unmarshal|UnmarshalCompressed)\(\s*(?:elliptic\.(?P<curve>P224|P256|P384|P521)\(\))?'
  raw_name: EC
  kind_hint: algorithm
  usage: unknown
  curve: '{curve}'
  library: crypto/elliptic

# Sign and verify sites carry no curve: it belongs to the key.
- id: GO_ECDSA_SIGN_VERIFY
  language: go
  pattern: '\becdsa\.(?:Sign|SignASN1|Verify|VerifyASN1)\('
  raw_name: ECDSA
  kind_hint: algorithm
  usage: signature
  library: crypto/ecdsa

# crypto/ecdh. The curve constructor is the evidence (ecdh.P256().GenerateKey(...), NewPrivateKey,
# NewPublicKey). X25519 through crypto/ecdh is reported as X25519, like the Python and x/crypto forms.
# Names checked on pkg.go.dev/crypto/ecdh, 2026-10-10. # verify
- id: GO_ECDH_CURVE
  language: go
  pattern: '\becdh\.(?P<curve>P256|P384|P521)\(\)'
  raw_name: ECDH
  kind_hint: algorithm
  usage: key_exchange
  curve: '{curve}'
  library: crypto/ecdh

- id: GO_ECDH_X25519
  language: go
  pattern: '\becdh\.X25519\(\)'
  raw_name: X25519
  kind_hint: algorithm
  usage: key_exchange
  library: crypto/ecdh

# golang.org/x/crypto/curve25519 (X25519 is the recommended call, ScalarMult is deprecated).
# Names checked on pkg.go.dev/golang.org/x/crypto/curve25519, 2026-10-10. # verify
- id: GO_CURVE25519
  language: go
  pattern: '\bcurve25519\.(?:X25519|ScalarMult|ScalarBaseMult)\('
  raw_name: X25519
  kind_hint: algorithm
  usage: key_exchange
  library: golang.org/x/crypto/curve25519

# crypto/mlkem (FIPS 203). The parameter set is in the function name and is kept in raw_name. A
# post-quantum KEM: reported as a positive finding, not a weakness.
# Names checked on pkg.go.dev/crypto/mlkem, 2026-10-10. # verify
- id: GO_MLKEM
  language: go
  pattern: '\bmlkem\.(?:GenerateKey|NewDecapsulationKey|NewEncapsulationKey)(?P<set>768|1024)\('
  raw_name: 'ML-KEM-{set}'
  kind_hint: algorithm
  usage: key_exchange
  library: crypto/mlkem

# ---- AES ----------------------------------------------------------------------------------------

# Key source: make([]byte, N) of a named or literal length. Never reported on its own. It only gives
# a size when its result is returned by a function, bound once and passed to the sink (flow link).
- id: GO_MAKE_KEY
  language: go
  pattern: '\bmake\(\s*\[\]byte\s*,\s*(?:(?P<key_size>\d+)|(?P<key_size_ref>[A-Za-z_]\w*))\s*\)'
  raw_name: AES-KEY
  kind_hint: key
  usage: encryption
  key_size_unit: bytes
  provides_key_size: AES
  emit: false

# aes.NewCipher(key). The mode comes from what the enclosing function does with the block, the key
# size from an inline []byte("...") literal (group key_literal, its length) or a constant directly,
# otherwise through a flow link.
#
# ECB needs affirmative evidence (M1M3-06): the function encrypts a block inside a loop and shows no
# chaining state (no XOR, IV, previous block or cipher.New* mode wrapper). A regex cannot prove that
# every block is independent, so the case is a heuristic and is capped at confidence 0.8. Anything
# else leaves mode None.
- id: GO_AES_NEWCIPHER
  language: go
  pattern: >-
    \baes\.NewCipher\(\s*(?:(?P<key_literal>\[\]byte\(\s*(?:"(?:[^"\\]|\\.)*"|`[^`]*`)\s*\))|(?P<key_arg>(?P<key_size_ref>[A-Za-z_]\w*)))\s*\)
  raw_name: AES
  kind_hint: algorithm
  usage: encryption
  library: crypto/aes
  key_size_from_length: true
  inherit_key_size: AES
  mode_cases:
    - mode: GCM
      requires: ['\bcipher\.NewGCM(?:WithNonceSize|WithTagSize|WithRandomNonce)?\(']
    - mode: CBC
      requires: ['\bcipher\.NewCBC(?:Encrypter|Decrypter)\(']
    - mode: CTR
      requires: ['\bcipher\.NewCTR\(']
    - mode: CFB
      requires: ['\bcipher\.NewCFB(?:Encrypter|Decrypter)\(']
    - mode: OFB
      requires: ['\bcipher\.NewOFB\(']
    - mode: ECB
      mode_source: block_loop
      requires: ['(?s)\bfor\b[^{\n]*\{[^{}]*\.Encrypt\(']
      forbids:
        - '\^'
        - '\bcipher\.New[A-Z]'
        - '(?i)\b(?:iv|nonce|prev\w*|xor\w*|chain\w*)\b'

# Hard-coded key (M1M3-02, M1M3-04): fires only when a literal reaches aes.NewCipher, inline, through a
# package-level constant or variable, or call-site arguments. The finding is at the literal's line.
# HMAC keys are outside the rule because hmac.New is not an AES sink.
- id: GO_HARDCODED_AES_KEY
  language: go
  pattern: >-
    \baes\.NewCipher\(\s*(?:(?P<literal>\[\]byte\(\s*(?:"(?:[^"\\]|\\.)*"|`[^`]*`)\s*\))|(?P<key_arg>[A-Za-z_]\w*))\s*\)
  raw_name: hard-coded symmetric key
  kind_hint: key
  usage: encryption
  library: crypto/aes
  literal_key: AES
  redact: true
  extra:
    hygiene_only: true
    hygiene_flags: [hardcoded_key]

# ---- insecure RNG -------------------------------------------------------------------------------

# Hygiene warning, not a primitive (M1M3-04). rand.Read means crypto/rand or math/rand depending on
# the import, so the call counts only when math/rand is imported under the name rand and crypto/rand
# is not bound to that name (crypto/rand imported as crand leaves rand.X a math/rand call).
# crypto/rand is a decoy and has no rule.
- id: GO_MATH_RAND
  language: go
  pattern: '\brand\.(?:[A-Z]\w*)\('
  raw_name: math/rand
  kind_hint: algorithm
  usage: rng
  library: math/rand
  requires: ['^[ \t]*(?:import[ \t]+)?(?:rand[ \t]+)?"math/rand(?:/v2)?"']
  forbids: ['^[ \t]*(?:import[ \t]+)?(?:rand[ \t]+)?"crypto/rand"']
  extra:
    hygiene_only: true
    hygiene_flags: [insecure_rng]

# ---- DES, 3DES and RC4 (M3M4-10) ----------------------------------------------------------------

# crypto/des and crypto/rc4 constructors. The import is required so a local variable named des or rc4
# is not read as the package. As seen, as in Java and PyCryptodome: DES, TripleDES, RC4. No size: the
# key length is not evidence of the cipher's strength here. No import-only rule: the call is the evidence.
# Names checked on pkg.go.dev/crypto/des and crypto/rc4, 2026-10-10. # verify
- id: GO_DES
  language: go
  pattern: '\bdes\.NewCipher\('
  requires: ['"crypto/des"']
  raw_name: DES
  kind_hint: algorithm
  usage: encryption
  library: crypto/des

- id: GO_TRIPLE_DES
  language: go
  pattern: '\bdes\.NewTripleDESCipher\('
  requires: ['"crypto/des"']
  raw_name: TripleDES
  kind_hint: algorithm
  usage: encryption
  library: crypto/des

- id: GO_RC4
  language: go
  pattern: '\brc4\.NewCipher\('
  requires: ['"crypto/rc4"']
  raw_name: RC4
  kind_hint: algorithm
  usage: encryption
  library: crypto/rc4

# ---- configured obsolete TLS and SSL versions (M3M4-09, M1M3-16) --------------------------------

# tls.Config MinVersion or MaxVersion set to tls.VersionTLS10, tls.VersionTLS11 or tls.VersionSSL30,
# in a composite literal (MinVersion: ...) or an assignment (cfg.MinVersion = ...). A bare reference
# (case tls.VersionTLS10: in a version-to-string helper, a comparison) is not a setting and emits
# nothing. One raw_name spelling per version; the constant goes in extra["source_constant"].
# Names checked on pkg.go.dev/crypto/tls, 2026-10-10. # verify
- id: GO_TLS_10
  language: go
  pattern: '\b(?:MinVersion|MaxVersion)\s*(?::|=(?!=))\s*tls\.(?P<const>VersionTLS10)\b'
  requires: ['"crypto/tls"']
  raw_name: TLS 1.0
  kind_hint: protocol_version
  usage: unknown
  library: crypto/tls
  extra:
    source_constant: 'tls.{const}'

- id: GO_TLS_11
  language: go
  pattern: '\b(?:MinVersion|MaxVersion)\s*(?::|=(?!=))\s*tls\.(?P<const>VersionTLS11)\b'
  requires: ['"crypto/tls"']
  raw_name: TLS 1.1
  kind_hint: protocol_version
  usage: unknown
  library: crypto/tls
  extra:
    source_constant: 'tls.{const}'

- id: GO_SSL_30
  language: go
  pattern: '\b(?:MinVersion|MaxVersion)\s*(?::|=(?!=))\s*tls\.(?P<const>VersionSSL30)\b'
  requires: ['"crypto/tls"']
  raw_name: SSLv3
  kind_hint: protocol_version
  usage: unknown
  library: crypto/tls
  extra:
    source_constant: 'tls.{const}'

# ---- TLS certificate verification disabled (M3M4-11) --------------------------------------------

# Hygiene warning, not a primitive: tls.Config{InsecureSkipVerify: true} or cfg.InsecureSkipVerify = true.
# Only the literal true; a variable or false emits nothing. Visible and unscored, like INSECURE-RNG.
- id: GO_INSECURE_SKIP_VERIFY
  language: go
  pattern: '\bInsecureSkipVerify\s*(?::|=(?!=))\s*true\b'
  requires: ['"crypto/tls"']
  raw_name: TLS certificate verification disabled
  kind_hint: policy
  usage: unknown
  library: crypto/tls
  extra:
    hygiene_only: true
    hygiene_flags: [tls_verify_disabled]

# ---- import-only findings (confidence 0.6) ------------------------------------------------------

- id: GO_IMPORT_MD5
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?:[A-Za-z_.]\w*[ \t]+)?"(?P<pkg>crypto/md5)"'
  raw_name: md5
  kind_hint: algorithm
  usage: hash
  library: crypto/md5
  confidence: 0.6
  forbids: ['\bmd5\.(?:Sum|New)\b']

- id: GO_IMPORT_SHA1
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?:[A-Za-z_.]\w*[ \t]+)?"(?P<pkg>crypto/sha1)"'
  raw_name: sha1
  kind_hint: algorithm
  usage: hash
  library: crypto/sha1
  confidence: 0.6
  forbids: ['\bsha1\.(?:Sum|New)\b']

# crypto/sha256 is imported by files that only use it for HMAC or PBKDF2 (sha256.New as an argument).
# That use is a call that wins.
- id: GO_IMPORT_SHA256
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?:[A-Za-z_.]\w*[ \t]+)?"(?P<pkg>crypto/sha256)"'
  raw_name: sha256
  kind_hint: algorithm
  usage: hash
  library: crypto/sha256
  confidence: 0.6
  forbids: ['\bsha256\.(?:Sum256|Sum224|New224|New)\b']

- id: GO_IMPORT_SHA512
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?:[A-Za-z_.]\w*[ \t]+)?"(?P<pkg>crypto/sha512)"'
  raw_name: sha512
  kind_hint: algorithm
  usage: hash
  library: crypto/sha512
  confidence: 0.6
  forbids: ['\bsha512\.(?:Sum384|New384|Sum512|New)\b']

- id: GO_IMPORT_RSA
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?:[A-Za-z_.]\w*[ \t]+)?"(?P<pkg>crypto/rsa)"'
  raw_name: RSA
  kind_hint: algorithm
  usage: unknown
  library: crypto/rsa
  confidence: 0.6
  forbids: ['\brsa\.(?:GenerateKey|Sign|Verify|Encrypt|Decrypt)(?:PKCS1v15|PSS|OAEP)\b']

- id: GO_IMPORT_ED25519
