- id: GO_IMPORT_MLKEM
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?:[A-Za-z_.]\w*[ \t]+)?"(?P<pkg>crypto/mlkem)"'
  raw_name: ML-KEM
  kind_hint: algorithm
