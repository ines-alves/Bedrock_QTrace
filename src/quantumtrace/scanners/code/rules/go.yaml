  library: crypto/mlkem
  confidence: 0.6
  forbids: ['\bmlkem\.(?:GenerateKey|NewDecapsulationKey|NewEncapsulationKey)(?:768|1024)\b']

# A math/rand import under another name (mrand) is the usual survivor: its calls carry the alias, which
# no rule follows, so the import line is the evidence. crypto/rand in the same file does not change that.
- id: GO_IMPORT_MATH_RAND_ALIASED
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?!rand[ \t])[A-Za-z_.]\w*[ \t]+"(?P<pkg>math/rand(?:/v2)?)"'
  raw_name: math/rand
  kind_hint: algorithm
  usage: rng
  library: math/rand
  confidence: 0.6
  extra:
    hygiene_only: true
    hygiene_flags: [insecure_rng]

# The same import under its own name: the rand.X calls are reported by GO_MATH_RAND, so the import line
# is kept only when the file has none.
- id: GO_IMPORT_MATH_RAND
  language: go
  pattern: '^[ \t]*(?:import[ \t]+)?(?:rand[ \t]+)?"(?P<pkg>math/rand(?:/v2)?)"'
  raw_name: math/rand
  kind_hint: algorithm
  usage: rng
  library: math/rand
  confidence: 0.6
  forbids: ['\brand\.[A-Z]\w*\(']
  extra:
    hygiene_only: true
    hygiene_flags: [insecure_rng]

# ---- SHA-3, password hashing and KDFs, ChaCha20-Poly1305 (outside validation F7) -----------------
# golang.org/x/crypto and the standard library use different SHAKE constructor casing. Checked on
# pkg.go.dev (x/crypto/sha3, bcrypt, argon2, scrypt, hkdf, chacha20poly1305; crypto/sha3,
# crypto/hkdf), 2026-10-11. # verify
- id: GO_SHA3
  language: go
  pattern: '\bsha3\.(?:New|Sum)(?P<bits>224|256|384|512)\('
  requires: ['"(?:golang\.org/x/crypto|crypto)/sha3"']
  raw_name: 'SHA3-{bits}'
  kind_hint: algorithm
  usage: hash
  library: sha3

- id: GO_SHAKE
  language: go
  pattern: '\bsha3\.(?:NewShake|NewSHAKE|ShakeSum|SumSHAKE)(?P<bits>128|256)\('
  requires: ['"(?:golang\.org/x/crypto|crypto)/sha3"']
  raw_name: 'SHAKE{bits}'
  kind_hint: algorithm
  usage: hash
  library: sha3

- id: GO_BCRYPT
  language: go
  pattern: '\bbcrypt\.(?:GenerateFromPassword|CompareHashAndPassword)\('
  requires: ['"golang\.org/x/crypto/bcrypt"']
  raw_name: bcrypt
  kind_hint: algorithm
  usage: kdf
  library: bcrypt

- id: GO_ARGON2ID
  language: go
