# Expected scanner-visible facts per fixture (M2M4-06). Generated by scripts/gen_pcaps.sh from real
# OpenSSL 3.6.4 handshakes on loopback; values were read with tshark and the pcap adapter.
# Only wire facts are stated here. Tier, threat and verdict belong to the engine, not to M2.
# Checked by tests/test_network_fixtures.py. Hex codepoints use the registry spelling.
tls12_ecdhe_ecdsa_p256.pcap:
  sni: ecdsa.lab
  version: TLS 1.2
  cipher_suite: "0xC02B"      # TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
  group: "0x0017"             # secp256r1, from ServerKeyExchange
  hello_frames: {client: 5, server: 7}
  certificate_in_capture: true   # Certificate message at frame 7; parsed by certs.py (task 2.9, pending)
tls13_offer_hybrid_server_x25519.pcap:
  sni: refuse.lab
  version: TLS 1.3
  cipher_suite: "0x1302"
  group: "0x001D"             # the server picks x25519
  offered_groups: ["0x11EC", "0x001D"]   # the client offers X25519MLKEM768 and x25519
  hello_frames: {client: 5, server: 7}
  certificate_in_capture: false          # encrypted in TLS 1.3
tls13_hybrid_keylog.pcap:
  sni: hybrid.lab
  version: TLS 1.3
  cipher_suite: "0x1302"
  group: "0x11EC"             # X25519MLKEM768 negotiated
  offered_groups: ["0x11EC"]
  hello_frames: {client: 5, server: 7}
  certificate_in_capture: false
  keylog: tls13_hybrid_keylog.keylog     # P2 path; the scanner does not read it
