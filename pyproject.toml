[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumtrace"
version = "0.1.0"
description = "Cryptographic inventory and post-quantum readiness scanner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "cryptography>=43",
    "cyclonedx-python-lib[json-validation]>=8",
    "jsonschema>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
probe = ["sslyze>=6"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
include = ["*.py", "*.pyi", "*.ipynb", "pyproject.toml"]
extend-exclude = ["agents", "sample-repos", "cloud-posture", "network-capture", "out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/quantumtrace"]
